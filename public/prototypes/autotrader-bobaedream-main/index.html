<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>보배드림 AutoScout형 임시 메인</title>
  <style>
    :root {
      --at-blue: #3155b7;
      --at-navy: #16212e;
      --ink: #172033;
      --muted: #657083;
      --line: #dfe5ee;
      --page: #f0f2f5;
      --panel: #fff;
      --shadow: 0 18px 42px rgba(18, 31, 53, .18);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #dfe4eb; color: var(--ink); }
    body { display: flex; justify-content: center; }
    button, input { font: inherit; }
    button { border: 0; background: none; color: inherit; padding: 0; }

    .phone {
      width: min(100vw, 430px);
      min-height: 100dvh;
      background: var(--page);
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(15, 23, 42, .18);
    }

    .topbar {
      height: 56px;
      padding: max(env(safe-area-inset-top), 0px) 12px 0 16px;
      background: var(--panel);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { display: flex; align-items: center; height: 44px; color: #17191c; text-decoration: none; }
    .title { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -.04em; }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .top-icons button { display: grid; width: 44px; height: 44px; border-radius: 50%; place-items: center; cursor: pointer; }
    .top-icons button:active { background: #f2f3f5; }
    .top-icons img { width: 24px; height: 24px; }

    .service-menu {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 16px;
      background: #fff;
      scrollbar-width: none;
      scroll-padding-inline: 16px;
    }
    .service-menu::-webkit-scrollbar { display: none; }

    .service-chip {
      flex: 0 0 auto;
      min-width: 53px;
      height: 36px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f5f5f5;
      color: #202124;
      font-size: 15px;
      line-height: 34px;
      font-weight: 700;
      letter-spacing: -.035em;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: none;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .service-chip.active {
      border-color: #252a30;
      background: #252a30;
      color: #fff;
      font-weight: 700;
      box-shadow: none;
    }

    .service-chip:active { transform: scale(.97); }
    .service-chip:focus-visible { outline: 2px solid var(--at-blue); outline-offset: 2px; }

    .search-strip { padding: 8px 16px 16px; background: #fff; }

    .search-field {
      height: 48px;
      min-width: 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 12px;
      background: #f5f5f5;
      transition: background 140ms ease, box-shadow 140ms ease;
    }

    .search-field:focus-within {
      background: #fff;
      box-shadow: 0 0 0 2px rgba(49, 85, 183, .2);
    }

    .search-field img { width: 22px; height: 22px; flex: 0 0 22px; }

    .search-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #222;
      font: inherit;
      font-size: 15px;
      line-height: 21px;
      font-weight: 400;
      letter-spacing: -.025em;
      appearance: none;
    }

    .search-field input::placeholder { color: #7d838c; opacity: 1; }
    .search-field input::-webkit-search-cancel-button { appearance: none; }

    .section {
      margin-top: 10px;
      padding: 23px 0 22px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    .category-section { margin-top: 0; }

    .section-head {
      padding: 0 17px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .section-subtitle {
      margin: 2px 0 0;
      color: #8a8a8a;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      letter-spacing: -.025em;
    }

    .more {
      margin-top: 5px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      color: #465264;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .more img { width: 18px; height: 18px; opacity: .78; }

    .body-rail, .offer-rail {
      display: flex;
      overflow-x: auto;
      gap: 18px;
      padding: 0 17px 2px;
      scrollbar-width: none;
    }

    .body-rail {
      --body-gap: 12px;
      gap: var(--body-gap);
    }
    .body-rail::-webkit-scrollbar, .offer-rail::-webkit-scrollbar { display: none; }

    .body-type {
      flex: 0 0 calc((100% + 17px - (var(--body-gap) * 4)) / 4);
      max-width: calc((100% + 17px - (var(--body-gap) * 4)) / 4);
      text-align: center;
    }

    .body-image {
      height: 64px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 7px;
    }

    .body-image img {
      width: 100%;
      max-width: 88px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 6px 4px rgba(15,23,42,.15));
    }

    .body-type strong {
      display: block;
      font-size: 14px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .sell-block {
      margin-top: 10px;
      padding: 18px 17px;
      background: #fff;
    }

    .sell-card {
      position: relative;
      overflow: hidden;
      min-height: 128px;
      padding: 20px;
      border-radius: 9px;
      background: linear-gradient(103deg, #172033 0 58%, #e8f2ff 59% 100%);
      color: #fff;
      box-shadow: 0 12px 22px rgba(15,23,42,.12);
    }

    .sell-card h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 23px;
      line-height: 1.14;
      letter-spacing: -.06em;
      font-weight: 950;
      width: 58%;
    }

    .sell-card p {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      color: rgba(255,255,255,.78);
      width: 58%;
      font-size: 12px;
      line-height: 1.42;
      letter-spacing: -.03em;
      font-weight: 700;
    }

    .sell-car {
      position: absolute;
      right: -18px;
      bottom: 2px;
      width: 178px;
      height: 92px;
      filter: drop-shadow(0 10px 8px rgba(15,23,42,.18));
    }

    .offer-card {
      flex: 0 0 174px;
      border: 1px solid #e1e7ef;
      border-radius: 9px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 5px 12px rgba(15,23,42,.06);
    }

    .offer-image {
      height: 92px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc, #e8edf5);
    }

    .offer-image img { width: 132px; height: 76px; object-fit: contain; filter: drop-shadow(0 7px 5px rgba(15,23,42,.16)); }
    .offer-copy { padding: 11px; }
    .offer-copy strong { display: block; font-size: 14px; line-height: 1.24; font-weight: 900; letter-spacing: -.04em; }
    .offer-copy span { display: block; margin-top: 5px; color: var(--at-blue); font-size: 13px; font-weight: 950; letter-spacing: -.035em; }

    .memo {
      padding: 17px;
      color: #657083;
      background: #fff;
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: -.02em;
      border-top: 1px solid #e2e8f0;
    }

    @media (min-width: 431px) {
      .phone { margin: 24px 0; border-radius: 28px; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="보배드림 AutoScout형 임시 메인">
    <header class="topbar">
      <a class="logo" href="../../" aria-label="보배드림 홈"><span class="title">보배드림</span></a>
      <div class="top-icons">
        <button type="button" aria-label="즐겨찾기"><img data-img="./icons/favorite.svg" alt="" /></button>
        <button type="button" aria-label="전체 메뉴"><img data-img="./icons/menu.svg" alt="" /></button>
      </div>
    </header>

    <nav class="service-menu" aria-label="서비스 메뉴">
      <button class="service-chip active" type="button" data-service="all" aria-pressed="true">전체</button>
      <button class="service-chip" type="button" data-service="used-car" aria-pressed="false">중고차</button>
      <button class="service-chip" type="button" data-service="community" aria-pressed="false">커뮤니티</button>
      <button class="service-chip" type="button" data-service="truck" aria-pressed="false">트럭/특장</button>
      <button class="service-chip" type="button" data-service="bike" aria-pressed="false">바이크</button>
      <button class="service-chip" type="button" data-service="construction" aria-pressed="false">건설기계</button>
      <button class="service-chip" type="button" data-service="camping" aria-pressed="false">캠핑카</button>
      <button class="service-chip" type="button" data-service="parts" aria-pressed="false">부품/용품</button>
    </nav>

    <form class="search-strip" role="search">
      <label class="search-field"><img src="./icons/search.svg" alt="" aria-hidden="true" /><input type="search" aria-label="중고차 검색" placeholder="어떤 차량을 찾고 있나요?" /></label>
    </form>

    <section class="section category-section" aria-labelledby="body-title">
      <div class="section-head">
        <div><h2 class="section-title" id="body-title">차량 카테고리</h2><p class="section-subtitle">차량 형태별로 빠르게 찾아보세요</p></div>
        <span class="more">전체보기 <img src="./icons/arrow-right.svg" alt="" aria-hidden="true" /></span>
      </div>
      <div class="body-rail" aria-label="차량 카테고리 가로 목록">
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/suv.png" alt="" /></span><strong>SUV</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/truck.png" alt="" /></span><strong>트럭</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/sedan.png" alt="" /></span><strong>세단</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/coupe.png" alt="" /></span><strong>쿠페</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/minivan.png" alt="" /></span><strong>미니밴</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/hatchback.png" alt="" /></span><strong>해치백</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/convertible.png" alt="" /></span><strong>컨버터블</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/wagon.png" alt="" /></span><strong>왜건</strong></button>
      </div>
    </section>

    <section class="sell-block">
      <div class="sell-card">
        <h2>내 차 팔기,<br />빠르고 쉽게</h2>
        <svg class="sell-car" viewBox="0 0 360 180" aria-hidden="true"><path d="M38 116c10-33 50-56 104-60h80c36 4 68 25 85 58l21 8v20H20v-16l18-10Z" fill="#fff" stroke="#c5d2e0" stroke-width="3"/><path d="M128 62h86c26 7 47 26 58 48H92c9-23 20-39 36-48Z" fill="#bad0e5" opacity=".78"/><circle cx="92" cy="142" r="25" fill="#1f2937"/><circle cx="270" cy="142" r="25" fill="#1f2937"/><circle cx="92" cy="142" r="11" fill="#cbd5e1"/><circle cx="270" cy="142" r="11" fill="#cbd5e1"/></svg>
      </div>
    </section>

    <section class="section" aria-labelledby="offer-title">
      <div class="section-head">
        <div><h2 class="section-title" id="offer-title">추천 매물</h2><p class="section-subtitle">지금 관심 있게 볼 만한 차량이에요</p></div>
        <span class="more">전체 <img src="./icons/arrow-right.svg" alt="" aria-hidden="true" /></span>
      </div>
      <div class="offer-rail" aria-label="추천 매물">
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/suv.svg" alt="" /></div><div class="offer-copy"><strong>BMW X3 xDrive20i</strong><span>5,280만원</span></div></article>
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/sedan.svg" alt="" /></div><div class="offer-copy"><strong>벤츠 E300 AMG</strong><span>6,150만원</span></div></article>
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/coupe.svg" alt="" /></div><div class="offer-copy"><strong>포르쉐 911 Carrera</strong><span>1억 6,900만원</span></div></article>
      </div>
    </section>

  </main>
  <script>
    document.querySelectorAll('img[data-img]').forEach((img) => {
      img.src = img.dataset.img.replace('|', '');
    });

    let activeService = 'all';
    document.querySelectorAll('[data-service]').forEach((button) => {
      button.addEventListener('click', () => {
        activeService = button.dataset.service;
        document.querySelectorAll('[data-service]').forEach((item) => {
          item.classList.remove('active');
          item.setAttribute('aria-pressed', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-pressed', 'true');
        button.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
    });

    document.querySelector('.search-strip').addEventListener('submit', (event) => {
      event.preventDefault();
      if (activeService === 'all' || activeService === 'used-car') {
        window.location.href = '../../?qf=guazi&filtericon=notion';
      }
    });
  </script>

</body>
</html>
