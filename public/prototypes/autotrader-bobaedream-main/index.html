<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>보배드림 AutoScout형 임시 메인</title>
  <style>
    :root {
      --at-blue: #3155b7;
      --at-navy: #16212e;
      --ink: #172033;
      --muted: #657083;
      --line: #dfe5ee;
      --page: #f0f2f5;
      --panel: #fff;
      --shadow: 0 18px 42px rgba(18, 31, 53, .18);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #dfe4eb; color: var(--ink); }
    body { display: flex; justify-content: center; }
    button, input { font: inherit; }
    button { border: 0; background: none; color: inherit; padding: 0; }

    .phone {
      width: min(100vw, 430px);
      min-height: 100dvh;
      background: var(--page);
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(15, 23, 42, .18);
    }

    .topbar {
      height: 58px;
      padding: max(env(safe-area-inset-top), 0px) 14px 0;
      background: var(--panel);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(15, 23, 42, .08);
    }

    .logo { display: flex; align-items: center; height: 40px; }
    .logo img { display: block; width: 122px; height: 30px; }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-icons button { display: grid; width: 40px; height: 40px; place-items: center; cursor: pointer; }
    .top-icons img { width: 22px; height: 22px; }

    .service-menu {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px 12px;
      background: #fff;
      border-bottom: 1px solid #eceef2;
      scrollbar-width: none;
      scroll-padding-inline: 16px;
    }
    .service-menu::-webkit-scrollbar { display: none; }

    .service-chip {
      flex: 0 0 auto;
      min-width: 58px;
      height: 40px;
      padding: 0 16px;
      border: 1px solid #b8c0ca;
      border-radius: 999px;
      background: #fff;
      color: #202b38;
      font-size: 14px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: -.035em;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 1px 1px rgba(22, 33, 46, .04);
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .service-chip.active {
      border-color: var(--at-navy);
      background: var(--at-navy);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 5px 12px rgba(22, 33, 46, .18);
    }

    .service-chip:active { transform: scale(.97); }
    .service-chip:focus-visible { outline: 2px solid var(--at-blue); outline-offset: 2px; }

    .hero {
      position: relative;
      min-height: 244px;
      padding: 22px 18px 88px;
      color: #fff;
      background-image: linear-gradient(180deg, rgba(5,10,20,.2) 0%, rgba(5,10,20,.38) 100%), var(--hero-bg, url("./hero-types/used-car.jpg"));
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 48%, rgba(0,0,0,.06) 100%);
      pointer-events: none;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      width: 72%;
      padding-top: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,.28);
    }

    .hero h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.08;
      letter-spacing: -.064em;
      font-weight: 950;
    }

    .hero p {
      margin: 10px 0 0;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      line-height: 1.44;
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .search-panel {
      position: relative;
      z-index: 3;
      margin: -58px 13px 0;
      padding: 18px 16px 20px;
      background: var(--panel);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: visible;
    }

    .search-form { display: grid; gap: 12px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .select-field {
      position: relative;
      height: 52px;
      border: 1px solid #adb5bf;
      border-radius: 5px;
      background: #fff;
      padding: 0 13px 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      color: #4a4f58;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -.035em;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .select-field:focus-visible {
      outline: 0;
      border-color: var(--at-blue);
      box-shadow: 0 0 0 3px rgba(49, 85, 183, .13);
    }

    .select-field.muted { color: #b5bac2; border-color: #e2e5e9; }

    .select-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .select-leading {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }

    .select-leading > img {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: #222;
    }

    .chevron {
      display: block;
      width: 20px;
      height: 20px;
      margin-left: 8px;
      flex: 0 0 auto;
    }

    .cta {
      height: 50px;
      border-radius: 999px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.035em;
      box-shadow: none;
    }

    .advanced-link {
      justify-self: center;
      margin-top: 3px;
      color: #1b498c;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: -.035em;
    }

    .section {
      margin-top: 10px;
      padding: 23px 0 22px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    .section-head {
      padding: 0 17px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 23px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -.06em;
    }

    .section-note {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: -.03em;
    }

    .more {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      color: #465264;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: -.04em;
    }

    .more img { width: 18px; height: 18px; opacity: .78; }

    .body-rail, .brand-rail, .offer-rail {
      display: flex;
      overflow-x: auto;
      gap: 18px;
      padding: 0 17px 2px;
      scrollbar-width: none;
    }

    .body-rail {
      --body-gap: 12px;
      gap: var(--body-gap);
    }
    .body-rail::-webkit-scrollbar, .brand-rail::-webkit-scrollbar, .offer-rail::-webkit-scrollbar { display: none; }

    .body-type {
      flex: 0 0 calc((100% + 17px - (var(--body-gap) * 4)) / 4);
      max-width: calc((100% + 17px - (var(--body-gap) * 4)) / 4);
      text-align: center;
    }

    .body-image {
      height: 64px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 7px;
    }

    .body-image img {
      width: 100%;
      max-width: 88px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 6px 4px rgba(15,23,42,.15));
    }

    .body-type strong {
      display: block;
      font-size: 14px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .brand-card {
      flex: 0 0 76px;
      display: grid;
      justify-items: center;
      gap: 8px;
      text-align: center;
    }

    .brand-emblem {
      width: 62px;
      height: 62px;
      border: 1px solid #dde3ec;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
      box-shadow: 0 5px 12px rgba(15,23,42,.08);
    }

    .brand-emblem img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
    }

    .brand-emblem.wide img { width: 44px; height: 28px; }
    .brand-emblem.porsche img { width: 34px; height: 42px; }

    .brand-name {
      font-size: 13px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
      color: #172033;
      white-space: nowrap;
    }

    .sell-block {
      margin-top: 10px;
      padding: 18px 17px;
      background: #fff;
    }

    .sell-card {
      position: relative;
      overflow: hidden;
      min-height: 128px;
      padding: 20px;
      border-radius: 9px;
      background: linear-gradient(103deg, #172033 0 58%, #e8f2ff 59% 100%);
      color: #fff;
      box-shadow: 0 12px 22px rgba(15,23,42,.12);
    }

    .sell-card h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 23px;
      line-height: 1.14;
      letter-spacing: -.06em;
      font-weight: 950;
      width: 58%;
    }

    .sell-card p {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      color: rgba(255,255,255,.78);
      width: 58%;
      font-size: 12px;
      line-height: 1.42;
      letter-spacing: -.03em;
      font-weight: 700;
    }

    .sell-car {
      position: absolute;
      right: -18px;
      bottom: 2px;
      width: 178px;
      height: 92px;
      filter: drop-shadow(0 10px 8px rgba(15,23,42,.18));
    }

    .offer-card {
      flex: 0 0 174px;
      border: 1px solid #e1e7ef;
      border-radius: 9px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 5px 12px rgba(15,23,42,.06);
    }

    .offer-image {
      height: 92px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc, #e8edf5);
    }

    .offer-image img { width: 132px; height: 76px; object-fit: contain; filter: drop-shadow(0 7px 5px rgba(15,23,42,.16)); }
    .offer-copy { padding: 11px; }
    .offer-copy strong { display: block; font-size: 14px; line-height: 1.24; font-weight: 900; letter-spacing: -.04em; }
    .offer-copy span { display: block; margin-top: 5px; color: var(--at-blue); font-size: 13px; font-weight: 950; letter-spacing: -.035em; }

    .memo {
      padding: 17px;
      color: #657083;
      background: #fff;
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: -.02em;
      border-top: 1px solid #e2e8f0;
    }

    @media (min-width: 431px) {
      .phone { margin: 24px 0; border-radius: 28px; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="보배드림 AutoScout형 임시 메인">
    <header class="topbar">
      <a class="logo" href="../../" aria-label="보배드림 홈"><img data-img="../../|assets/bbm/header-logo.svg" alt="보배드림" /></a>
      <div class="top-icons">
        <button type="button" aria-label="검색"><img data-img="./icons/search.svg" alt="" /></button>
        <button type="button" aria-label="전체 메뉴"><img data-img="./icons/menu.svg" alt="" /></button>
      </div>
    </header>

    <nav class="service-menu" aria-label="서비스 메뉴">
      <button class="service-chip active" type="button" data-service="all" aria-pressed="true">전체</button>
      <button class="service-chip" type="button" data-service="used-car" aria-pressed="false">중고차</button>
      <button class="service-chip" type="button" data-service="community" aria-pressed="false">커뮤니티</button>
      <button class="service-chip" type="button" data-service="truck" aria-pressed="false">트럭/특장</button>
      <button class="service-chip" type="button" data-service="bike" aria-pressed="false">바이크</button>
      <button class="service-chip" type="button" data-service="construction" aria-pressed="false">건설기계</button>
      <button class="service-chip" type="button" data-service="camping" aria-pressed="false">캠핑카</button>
      <button class="service-chip" type="button" data-service="parts" aria-pressed="false">부품/용품</button>
    </nav>

    <section class="hero" data-hero>
      <div class="hero-copy">
        <h1 data-hero-title>자동차 생활의 모든 것</h1>
        <p data-hero-copy>매물부터 커뮤니티까지 보배드림에서 한 번에 만나보세요.</p>
      </div>
    </section>

    <section class="search-panel" aria-label="매물 검색 패널">
      <div class="search-form">
        <div class="row-2">
          <button class="select-field" type="button"><span class="select-value">제조사 선택</span><img class="chevron" src="./icons/chevron-down.svg" alt="" aria-hidden="true" /></button>
          <button class="select-field muted" type="button"><span class="select-value">모델 선택</span><img class="chevron" src="./icons/chevron-down.svg" alt="" aria-hidden="true" /></button>
        </div>
        <button class="select-field" type="button"><span class="select-leading"><img src="./icons/location.svg" alt="" aria-hidden="true" /><span class="select-value">전국</span></span><img class="chevron" src="./icons/chevron-down.svg" alt="" aria-hidden="true" /></button>
        <button class="cta" type="button" data-list-link>64대 매물 보기</button>
        <button class="advanced-link" type="button">상세 필터</button>
      </div>
    </section>

    <section class="section" aria-labelledby="body-title">
      <div class="section-head">
        <div><h2 class="section-title" id="body-title">바디 타입</h2></div>
        <span class="more">전체보기 <img src="./icons/arrow-right.svg" alt="" aria-hidden="true" /></span>
      </div>
      <div class="body-rail" aria-label="바디 타입 가로 목록">
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/suv.png" alt="" /></span><strong>SUV</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/truck.png" alt="" /></span><strong>트럭</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/sedan.png" alt="" /></span><strong>세단</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/coupe.png" alt="" /></span><strong>쿠페</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/minivan.png" alt="" /></span><strong>미니밴</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/hatchback.png" alt="" /></span><strong>해치백</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/convertible.png" alt="" /></span><strong>컨버터블</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/wagon.png" alt="" /></span><strong>왜건</strong></button>
      </div>
    </section>

    <section class="section" aria-labelledby="brand-title">
      <div class="section-head">
        <div><h2 class="section-title" id="brand-title">인기 제조사</h2></div>
        <span class="more">더보기 <img src="./icons/arrow-right.svg" alt="" aria-hidden="true" /></span>
      </div>
      <div class="brand-rail" aria-label="인기 제조사">
        <button class="brand-card" type="button" aria-label="현대"><span class="brand-emblem"><img data-img="./brand-emblems/hyundai.svg" alt="" /></span><span class="brand-name">현대</span></button>
        <button class="brand-card" type="button" aria-label="기아"><span class="brand-emblem wide"><img data-img="./brand-emblems/kia.svg" alt="" /></span><span class="brand-name">기아</span></button>
        <button class="brand-card" type="button" aria-label="BMW"><span class="brand-emblem"><img data-img="../../|assets/brand/bmw.svg" alt="" /></span><span class="brand-name">BMW</span></button>
        <button class="brand-card" type="button" aria-label="벤츠"><span class="brand-emblem"><img data-img="../../|assets/brand/benz.png" alt="" /></span><span class="brand-name">벤츠</span></button>
        <button class="brand-card" type="button" aria-label="아우디"><span class="brand-emblem wide"><img data-img="../../|assets/brand/audi.svg" alt="" /></span><span class="brand-name">아우디</span></button>
        <button class="brand-card" type="button" aria-label="포르쉐"><span class="brand-emblem porsche"><img data-img="../../|assets/brand/porsche-symbol.png" alt="" /></span><span class="brand-name">포르쉐</span></button>
      </div>
    </section>

    <section class="sell-block">
      <div class="sell-card">
        <h2>내 차 팔기,<br />빠르고 쉽게</h2>
        <svg class="sell-car" viewBox="0 0 360 180" aria-hidden="true"><path d="M38 116c10-33 50-56 104-60h80c36 4 68 25 85 58l21 8v20H20v-16l18-10Z" fill="#fff" stroke="#c5d2e0" stroke-width="3"/><path d="M128 62h86c26 7 47 26 58 48H92c9-23 20-39 36-48Z" fill="#bad0e5" opacity=".78"/><circle cx="92" cy="142" r="25" fill="#1f2937"/><circle cx="270" cy="142" r="25" fill="#1f2937"/><circle cx="92" cy="142" r="11" fill="#cbd5e1"/><circle cx="270" cy="142" r="11" fill="#cbd5e1"/></svg>
      </div>
    </section>

    <section class="section" aria-labelledby="offer-title">
      <div class="section-head">
        <div><h2 class="section-title" id="offer-title">추천 매물</h2></div>
        <span class="more">전체 <img src="./icons/arrow-right.svg" alt="" aria-hidden="true" /></span>
      </div>
      <div class="offer-rail" aria-label="추천 매물">
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/suv.svg" alt="" /></div><div class="offer-copy"><strong>BMW X3 xDrive20i</strong><span>5,280만원</span></div></article>
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/sedan.svg" alt="" /></div><div class="offer-copy"><strong>벤츠 E300 AMG</strong><span>6,150만원</span></div></article>
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/coupe.svg" alt="" /></div><div class="offer-copy"><strong>포르쉐 911 Carrera</strong><span>1억 6,900만원</span></div></article>
      </div>
    </section>

  </main>
  <script>
    document.querySelectorAll('img[data-img]').forEach((img) => {
      img.src = img.dataset.img.replace('|', '');
    });

    const heroData = {
      all: {
        title: '자동차 생활의 모든 것',
        copy: '매물부터 커뮤니티까지 보배드림에서 한 번에 만나보세요.',
        image: './hero-types/used-car.jpg',
        count: '64대 매물 보기'
      },
      'used-car': {
        title: '좋은 차를 찾는 가장 빠른 방법',
        copy: '보배드림에서 내 조건에 맞는 중고차를 바로 찾아보세요.',
        image: './hero-types/used-car.jpg',
        count: '64대 매물 보기'
      },
      community: {
        title: '자동차 이야기가 모이는 곳',
        copy: '유저들의 생생한 경험과 자동차 소식을 확인하세요.',
        image: './hero-types/used-car.jpg',
        count: '커뮤니티 둘러보기'
      },
      truck: {
        title: '일을 움직이는 트럭과 특장차',
        copy: '화물과 특장 매물을 목적에 맞게 찾아보세요.',
        image: './hero-types/commercial.jpg',
        count: '트럭/특장 준비 중'
      },
      bike: {
        title: '라이딩을 시작할 바이크 찾기',
        copy: '스쿠터부터 대형 바이크까지 원하는 조건으로 탐색하세요.',
        image: './hero-types/bike.jpg',
        count: '바이크 준비 중'
      },
      construction: {
        title: '현장을 위한 건설기계 찾기',
        copy: '용도와 작업 조건에 맞는 건설기계를 살펴보세요.',
        image: './hero-types/commercial.jpg',
        count: '건설기계 준비 중'
      },
      camping: {
        title: '여행을 넓히는 캠핑카',
        copy: '카라반부터 모터홈까지 원하는 방식으로 찾아보세요.',
        image: './hero-types/trailer.jpg',
        count: '캠핑카 준비 중'
      },
      parts: {
        title: '차를 위한 부품과 용품',
        copy: '필요한 부품과 자동차 용품을 한곳에서 찾아보세요.',
        image: './hero-types/used-car.jpg',
        count: '부품/용품 준비 중'
      }
    };

    const hero = document.querySelector('[data-hero]');
    const heroTitle = document.querySelector('[data-hero-title]');
    const heroCopy = document.querySelector('[data-hero-copy]');
    const cta = document.querySelector('.cta');

    let activeService = 'all';
    document.querySelectorAll('[data-service]').forEach((button) => {
      button.addEventListener('click', () => {
        const data = heroData[button.dataset.service];
        if (!data) return;
        activeService = button.dataset.service;
        document.querySelectorAll('[data-service]').forEach((item) => {
          item.classList.remove('active');
          item.setAttribute('aria-pressed', 'false');
        });
        button.classList.add('active');
        button.setAttribute('aria-pressed', 'true');
        button.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        hero.style.setProperty('--hero-bg', `url("${data.image}")`);
        heroTitle.textContent = data.title;
        heroCopy.textContent = data.copy;
        cta.textContent = data.count;
      });
    });

    cta.addEventListener('click', () => {
      if (activeService === 'all' || activeService === 'used-car') {
        window.location.href = '../../?qf=guazi&filtericon=notion';
      }
    });
  </script>

</body>
</html>
