<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>보배드림 AutoTrader형 모바일 메인 시안</title>
  <style>
    :root {
      --at-red: #d71920;
      --at-red-deep: #b50913;
      --at-blue: #006dff;
      --ink: #172033;
      --muted: #657083;
      --line: #dfe5ee;
      --page: #f0f2f5;
      --panel: #fff;
      --shadow: 0 18px 42px rgba(18, 31, 53, .18);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #dfe4eb; color: var(--ink); }
    body { display: flex; justify-content: center; }
    button, input { font: inherit; }
    button { border: 0; background: none; color: inherit; padding: 0; }

    .phone {
      width: min(100vw, 430px);
      min-height: 100dvh;
      background: var(--page);
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(15, 23, 42, .18);
    }

    .topbar {
      height: 58px;
      padding: max(env(safe-area-inset-top), 0px) 14px 0;
      background: var(--panel);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(15, 23, 42, .08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 950;
      letter-spacing: -.045em;
      line-height: .9;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--at-red);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 950;
      transform: skewX(-9deg);
    }

    .logo-text {
      display: grid;
      gap: 1px;
      font-size: 18px;
    }

    .logo-text small {
      font-size: 10px;
      letter-spacing: .09em;
      font-weight: 800;
      opacity: .82;
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .top-icons svg { width: 23px; height: 23px; stroke-width: 2.2; }

    .hero {
      position: relative;
      min-height: 244px;
      padding: 22px 18px 88px;
      color: #fff;
      background-image: linear-gradient(180deg, rgba(5,10,20,.2) 0%, rgba(5,10,20,.38) 100%), var(--hero-bg, url("./hero-types/used-car.jpg"));
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 48%, rgba(0,0,0,.06) 100%);
      pointer-events: none;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      width: 72%;
      padding-top: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,.28);
    }

    .hero h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.08;
      letter-spacing: -.064em;
      font-weight: 950;
    }

    .hero p {
      margin: 10px 0 0;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      line-height: 1.44;
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .search-panel {
      position: relative;
      z-index: 3;
      margin: -58px 13px 0;
      padding: 18px 17px 20px;
      background: var(--panel);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: visible;
    }

    .vehicle-tabs {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 0 0 18px;
      scrollbar-width: none;
      background: #fff;
    }
    .vehicle-tabs::-webkit-scrollbar { display: none; }

    .vehicle-tab {
      flex: 0 0 auto;
      height: 39px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e1e3e7;
      border-radius: 999px;
      background: #f8f8f8;
      color: #40444c;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 1px 2px rgba(15,23,42,.05);
      font-size: 15px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -.035em;
      text-align: center;
      white-space: nowrap;
    }

    .vehicle-tab.active {
      border-color: #232323;
      background: #232323;
      color: #fff;
      box-shadow: none;
      font-weight: 850;
    }

    .search-form { display: grid; gap: 14px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .select-field {
      position: relative;
      height: 55px;
      border: 1px solid #cfd3d9;
      border-radius: 4px;
      background: #fff;
      padding: 0 15px 0 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      color: #4a4f58;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -.035em;
    }


    .select-field.muted { color: #b5bac2; border-color: #e2e5e9; }

    .select-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .chevron {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 7px solid currentColor;
      margin-left: 8px;
      opacity: .95;
      flex: 0 0 auto;
    }

    .cta {
      height: 50px;
      border-radius: 999px;
      background: #0878ea;
      color: #fff;
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.035em;
      box-shadow: none;
    }

    .advanced-link {
      justify-self: center;
      margin-top: 3px;
      color: #1268bf;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: -.035em;
    }

    .section {
      margin-top: 10px;
      padding: 23px 0 22px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    .section-head {
      padding: 0 17px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 23px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -.06em;
    }

    .section-note {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: -.03em;
    }

    .more { color: #5f6c7e; font-size: 13px; font-weight: 850; letter-spacing: -.04em; }

    .body-rail, .brand-rail, .offer-rail {
      display: flex;
      overflow-x: auto;
      gap: 18px;
      padding: 0 17px 2px;
      scrollbar-width: none;
    }

    .body-rail {
      --body-gap: 12px;
      gap: var(--body-gap);
    }
    .body-rail::-webkit-scrollbar, .brand-rail::-webkit-scrollbar, .offer-rail::-webkit-scrollbar { display: none; }

    .body-type {
      flex: 0 0 calc((100% + 17px - (var(--body-gap) * 4)) / 4);
      max-width: calc((100% + 17px - (var(--body-gap) * 4)) / 4);
      text-align: center;
    }

    .body-image {
      height: 64px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 7px;
    }

    .body-image img {
      width: 100%;
      max-width: 88px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 6px 4px rgba(15,23,42,.15));
    }

    .body-type strong {
      display: block;
      font-size: 14px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .brand-card {
      flex: 0 0 76px;
      display: grid;
      justify-items: center;
      gap: 8px;
      text-align: center;
    }

    .brand-emblem {
      width: 62px;
      height: 62px;
      border: 1px solid #dde3ec;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
      box-shadow: 0 5px 12px rgba(15,23,42,.08);
    }

    .brand-emblem img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
    }

    .brand-emblem.wide img { width: 44px; height: 28px; }
    .brand-emblem.porsche img { width: 34px; height: 42px; }

    .brand-name {
      font-size: 13px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
      color: #172033;
      white-space: nowrap;
    }

    .sell-block {
      margin-top: 10px;
      padding: 18px 17px;
      background: #fff;
    }

    .sell-card {
      position: relative;
      overflow: hidden;
      min-height: 128px;
      padding: 20px;
      border-radius: 9px;
      background: linear-gradient(103deg, #172033 0 58%, #e8f2ff 59% 100%);
      color: #fff;
      box-shadow: 0 12px 22px rgba(15,23,42,.12);
    }

    .sell-card h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 23px;
      line-height: 1.14;
      letter-spacing: -.06em;
      font-weight: 950;
      width: 58%;
    }

    .sell-card p {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      color: rgba(255,255,255,.78);
      width: 58%;
      font-size: 12px;
      line-height: 1.42;
      letter-spacing: -.03em;
      font-weight: 700;
    }

    .sell-car {
      position: absolute;
      right: -18px;
      bottom: 2px;
      width: 178px;
      height: 92px;
      filter: drop-shadow(0 10px 8px rgba(15,23,42,.18));
    }

    .offer-card {
      flex: 0 0 174px;
      border: 1px solid #e1e7ef;
      border-radius: 9px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 5px 12px rgba(15,23,42,.06);
    }

    .offer-image {
      height: 92px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc, #e8edf5);
    }

    .offer-image img { width: 132px; height: 76px; object-fit: contain; filter: drop-shadow(0 7px 5px rgba(15,23,42,.16)); }
    .offer-copy { padding: 11px; }
    .offer-copy strong { display: block; font-size: 14px; line-height: 1.24; font-weight: 900; letter-spacing: -.04em; }
    .offer-copy span { display: block; margin-top: 5px; color: var(--at-blue); font-size: 13px; font-weight: 950; letter-spacing: -.035em; }

    .memo {
      padding: 17px;
      color: #657083;
      background: #fff;
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: -.02em;
      border-top: 1px solid #e2e8f0;
    }

    @media (min-width: 431px) {
      .phone { margin: 24px 0; border-radius: 28px; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="보배드림 AutoTrader형 모바일 메인 시안">
    <header class="topbar">
      <div class="logo" aria-label="보배드림">
        <span class="logo-mark">B</span>
        <span class="logo-text">보배드림<small>BOBAEDREAM</small></span>
      </div>
      <div class="top-icons" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </div>
    </header>

    <section class="hero" data-hero>
      <div class="hero-copy">
        <h1 data-hero-title>좋은 차를 찾는 가장 빠른 방법</h1>
        <p data-hero-copy>보배드림에서 내 조건에 맞는 중고차를 바로 찾아보세요.</p>
      </div>
    </section>

    <section class="search-panel" aria-label="매물 검색 패널">
      <div class="vehicle-tabs" aria-label="차량 유형 탭">
        <button class="vehicle-tab active" type="button" data-vehicle-type="used-car">중고차</button>
        <button class="vehicle-tab" type="button" data-vehicle-type="bike">바이크</button>
        <button class="vehicle-tab" type="button" data-vehicle-type="trailer">트레일러</button>
        <button class="vehicle-tab" type="button" data-vehicle-type="commercial">상용차</button>
      </div>
      <div class="search-form">
        <div class="row-2">
          <button class="select-field" type="button"><span class="select-value">제조사 선택</span><span class="chevron" aria-hidden="true"></span></button>
          <button class="select-field muted" type="button"><span class="select-value">모델 선택</span><span class="chevron" aria-hidden="true"></span></button>
        </div>
        <button class="select-field" type="button"><span class="select-value">전국</span><span class="chevron" aria-hidden="true"></span></button>
        <button class="cta" type="button">404,717대 매물 보기</button>
        <button class="advanced-link" type="button">상세 필터</button>
      </div>
    </section>

    <section class="section" aria-labelledby="body-title">
      <div class="section-head">
        <div><h2 class="section-title" id="body-title">바디 타입</h2></div>
        <span class="more">전체보기 ›</span>
      </div>
      <div class="body-rail" aria-label="바디 타입 가로 목록">
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/suv.png" alt="" /></span><strong>SUV</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/truck.png" alt="" /></span><strong>트럭</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/sedan.png" alt="" /></span><strong>세단</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/coupe.png" alt="" /></span><strong>쿠페</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/minivan.png" alt="" /></span><strong>미니밴</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/hatchback.png" alt="" /></span><strong>해치백</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/convertible.png" alt="" /></span><strong>컨버터블</strong></button>
        <button class="body-type" type="button"><span class="body-image"><img data-img="./autotrader-body-types-v2/wagon.png" alt="" /></span><strong>왜건</strong></button>
      </div>
    </section>

    <section class="section" aria-labelledby="brand-title">
      <div class="section-head">
        <div><h2 class="section-title" id="brand-title">인기 제조사</h2></div>
        <span class="more">더보기 ›</span>
      </div>
      <div class="brand-rail" aria-label="인기 제조사">
        <button class="brand-card" type="button" aria-label="현대"><span class="brand-emblem"><img data-img="./brand-emblems/hyundai.svg" alt="" /></span><span class="brand-name">현대</span></button>
        <button class="brand-card" type="button" aria-label="기아"><span class="brand-emblem wide"><img data-img="./brand-emblems/kia.svg" alt="" /></span><span class="brand-name">기아</span></button>
        <button class="brand-card" type="button" aria-label="BMW"><span class="brand-emblem"><img data-img="../../|assets/brand/bmw.svg" alt="" /></span><span class="brand-name">BMW</span></button>
        <button class="brand-card" type="button" aria-label="벤츠"><span class="brand-emblem"><img data-img="../../|assets/brand/benz.png" alt="" /></span><span class="brand-name">벤츠</span></button>
        <button class="brand-card" type="button" aria-label="아우디"><span class="brand-emblem wide"><img data-img="../../|assets/brand/audi.svg" alt="" /></span><span class="brand-name">아우디</span></button>
        <button class="brand-card" type="button" aria-label="포르쉐"><span class="brand-emblem porsche"><img data-img="../../|assets/brand/porsche-symbol.png" alt="" /></span><span class="brand-name">포르쉐</span></button>
      </div>
    </section>

    <section class="sell-block">
      <div class="sell-card">
        <h2>내 차 팔기,<br />빠르고 쉽게</h2>
        <svg class="sell-car" viewBox="0 0 360 180" aria-hidden="true"><path d="M38 116c10-33 50-56 104-60h80c36 4 68 25 85 58l21 8v20H20v-16l18-10Z" fill="#fff" stroke="#c5d2e0" stroke-width="3"/><path d="M128 62h86c26 7 47 26 58 48H92c9-23 20-39 36-48Z" fill="#bad0e5" opacity=".78"/><circle cx="92" cy="142" r="25" fill="#1f2937"/><circle cx="270" cy="142" r="25" fill="#1f2937"/><circle cx="92" cy="142" r="11" fill="#cbd5e1"/><circle cx="270" cy="142" r="11" fill="#cbd5e1"/></svg>
      </div>
    </section>

    <section class="section" aria-labelledby="offer-title">
      <div class="section-head">
        <div><h2 class="section-title" id="offer-title">추천 매물</h2></div>
        <span class="more">전체 ›</span>
      </div>
      <div class="offer-rail" aria-label="추천 매물">
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/suv.svg" alt="" /></div><div class="offer-copy"><strong>BMW X3 xDrive20i</strong><span>5,280만원</span></div></article>
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/sedan.svg" alt="" /></div><div class="offer-copy"><strong>벤츠 E300 AMG</strong><span>6,150만원</span></div></article>
        <article class="offer-card"><div class="offer-image"><img data-img="../passenger-body-types/|assets/coupe.svg" alt="" /></div><div class="offer-copy"><strong>포르쉐 911 Carrera</strong><span>1억 6,900만원</span></div></article>
      </div>
    </section>

  </main>
  <script>
    document.querySelectorAll('img[data-img]').forEach((img) => {
      img.src = img.dataset.img.replace('|', '');
    });

    const heroData = {
      'used-car': {
        title: '좋은 차를 찾는 가장 빠른 방법',
        copy: '보배드림에서 내 조건에 맞는 중고차를 바로 찾아보세요.',
        image: './hero-types/used-car.jpg',
        count: '404,717대 매물 보기'
      },
      bike: {
        title: '라이딩을 시작할 바이크 찾기',
        copy: '스쿠터부터 대형 바이크까지 원하는 조건으로 탐색하세요.',
        image: './hero-types/bike.jpg',
        count: '18,240대 매물 보기'
      },
      trailer: {
        title: '캠핑과 이동을 위한 트레일러',
        copy: '카라반, 트레일러, 캠핑 장비형 매물을 한 번에 확인하세요.',
        image: './hero-types/trailer.jpg',
        count: '7,820대 매물 보기'
      },
      commercial: {
        title: '일을 움직이는 상용차 찾기',
        copy: '화물, 특장, 밴, 업무용 차량을 목적에 맞게 찾아보세요.',
        image: './hero-types/commercial.jpg',
        count: '36,910대 매물 보기'
      }
    };

    const hero = document.querySelector('[data-hero]');
    const heroTitle = document.querySelector('[data-hero-title]');
    const heroCopy = document.querySelector('[data-hero-copy]');
    const cta = document.querySelector('.cta');

    document.querySelectorAll('[data-vehicle-type]').forEach((button) => {
      button.addEventListener('click', () => {
        const data = heroData[button.dataset.vehicleType];
        if (!data) return;
        document.querySelectorAll('[data-vehicle-type]').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        hero.style.setProperty('--hero-bg', `url("${data.image}")`);
        heroTitle.textContent = data.title;
        heroCopy.textContent = data.copy;
        cta.textContent = data.count;
      });
    });
  </script>

</body>
</html>
