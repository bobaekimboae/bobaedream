<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>건설기계 이미지 각도 비교</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #222; background: #f5f6f8; font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 720px); min-height: 100vh; margin: 0 auto; padding: 24px 16px 48px; background: #fff; }
      h1 { margin: 0; font-size: 22px; line-height: 30px; letter-spacing: -.3px; }
      .intro { margin: 8px 0 22px; color: #6b6b6b; font-size: 14px; line-height: 21px; }
      h2 { margin: 0 0 12px; font-size: 17px; line-height: 24px; }
      .production-rail { display: flex; gap: 8px; margin: 0 -16px 28px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
      .production-rail::-webkit-scrollbar { display: none; }
      .slot { flex: 0 0 76px; width: 76px; min-height: 102px; text-align: center; }
      .slot img { display: block; width: 64px; height: 40px; margin: 0 auto 14px; object-fit: contain; }
      .slot strong { display: -webkit-box; overflow: hidden; color: #333; font-size: 14px; font-weight: 500; line-height: 20px; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .slot small { display: block; margin-top: 4px; color: #8a8a8a; font-size: 11px; }
      .comparison { border-top: 1px solid #ececec; }
      .row { padding: 20px 0 24px; border-bottom: 1px solid #ececec; }
      .row h3 { margin: 0 0 14px; font-size: 16px; line-height: 22px; }
      .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .option { min-width: 0; padding: 12px 8px 10px; border: 1px solid #e3e4e7; border-radius: 14px; background: #fafafa; text-align: center; }
      .option img { display: block; width: 100%; aspect-ratio: 8 / 5; object-fit: contain; }
      .option b { display: block; margin-top: 7px; font-size: 14px; line-height: 20px; }
      .option span { display: block; color: #777; font-size: 12px; line-height: 18px; }
      @media (min-width: 721px) {
        main { padding: 32px 24px 56px; box-shadow: 0 0 0 1px #ececec; }
        .production-rail { margin-inline: -24px; padding-inline: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>건설기계 이미지 각도 비교</h1>
      <p class="intro">AutoTrader.ca의 높은 실사 품질·전체 외곽 노출·동일 바닥선을 품질 하한으로 두고, 같은 8:5 원본과 동일 배율로 정규화했습니다. 위는 실제 모바일 퀵필터 슬롯, 아래는 확대 비교입니다.</p>
      <h2>실제 슬롯 64×40px</h2>
      <div class="production-rail" id="rail"></div>
      <section class="comparison" id="comparison"></section>
    </main>
    <script>
      const types = [
        ['bulldozer', '불도저'], ['excavator', '굴착기'], ['loader', '로더'], ['forklift', '지게차'], ['scraper', '스크레이퍼']
      ];
      const root = './assets/heavy/pilot/angle-comparison-v01/web/';
      const image = (slug, angle) => `${root}heavy_${slug}_${angle}_v01.png`;
      document.querySelector('#rail').innerHTML = types.flatMap(([slug, label]) => [
        `<article class="slot"><img src="${image(slug, 'side')}" alt="${label} 정측면"><strong>${label}</strong><small>A 측면</small></article>`,
        `<article class="slot"><img src="${image(slug, 'angle')}" alt="${label} 3/4 각도"><strong>${label}</strong><small>B 각도</small></article>`
      ]).join('');
      document.querySelector('#comparison').innerHTML = types.map(([slug, label]) => `
        <article class="row">
          <h3>${label}</h3>
          <div class="pair">
            <div class="option"><img src="${image(slug, 'side')}" alt="${label} 정측면 확대"><b>A. 정측면</b><span>좌향 90° · 무원근</span></div>
            <div class="option"><img src="${image(slug, 'angle')}" alt="${label} 각도 확대"><b>B. 각도</b><span>좌향 3/4 · 입체감</span></div>
          </div>
        </article>`).join('');
    </script>
  </body>
</html>
