<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="보배드림 딜러와 촬영팀을 위한 휴대폰 숏폼 촬영 업로더 프로토타입"
    />
    <title>보배드림 숏폼 촬영 업로더</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-root"></div>

    <input id="filePicker" type="file" accept="image/*,video/*" multiple hidden />
    <input id="replacePicker" type="file" accept="image/*,video/*" hidden />

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
