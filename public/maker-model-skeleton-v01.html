<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>보배드림 제조사·모델 선택</title>
    <link rel="stylesheet" href="/assets/fonts/pretendard/pretendard-guazi.css" />
    <link rel="stylesheet" href="./maker-model-skeleton-v01.css?v=generation-layout-1007" />
  </head>
  <body>
    <main class="prototype-shell">
      <section class="brief-panel" aria-labelledby="brief-title">
        <p class="eyebrow">보배드림 차량 검색</p>
        <h1 id="brief-title">제조사·모델 선택</h1>
        <p class="brief-copy">
          제조사부터 모델·세대·등급까지 빠르게 찾아 원하는 차량을 선택할 수 있습니다.
        </p>

        <div class="control-group" aria-label="화면 단계 선택">
          <span class="control-label">화면</span>
          <div class="segmented" id="screen-controls">
            <button type="button" data-screen="0">0 필터</button>
            <button type="button" data-screen="1" class="is-active">1 제조사</button>
            <button type="button" data-screen="2">2 모델</button>
            <button type="button" data-screen="3">3 세부모델</button>
            <button type="button" data-screen="4">4 등급</button>
          </div>
        </div>

        <dl class="token-table">
          <div><dt>로고 기본</dt><dd>38×26 슬롯 · 면적 기준 26 · 간격 12 · 행 48</dd></div>
          <div><dt>모델</dt><dd>74×46 이미지 · 간격 18 · 행 50</dd></div>
          <div><dt>세부모델</dt><dd>74×46 이미지 · 간격 18 · 행 56</dd></div>
          <div><dt>등급</dt><dd>오토스카우트식 들여쓰기 · 체크박스 20 · 행 48</dd></div>
        </dl>

      </section>

      <section class="phone-stage" aria-label="제조사·모델 선택 화면 미리보기">
        <div class="phone">
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <header class="sheet-header">
              <button class="icon-button" id="back-button" type="button" aria-label="이전 화면">
                <img src="/assets/maker-model/icons/finn-back-arrow-18.svg" alt="" />
              </button>
              <h2 id="sheet-title">제조사</h2>
              <button class="icon-button" id="close-button" type="button" aria-label="닫기">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </button>
            </header>

            <div class="sheet-body" id="sheet-body"></div>

            <footer class="sheet-footer">
              <div class="footer-actions">
                <button class="reset-button" id="reset-button" type="button">초기화</button>
                <button class="apply-button" id="apply-button" type="button">198,208대 보기</button>
              </div>
            </footer>
          </div>
        </div>
      </section>
    </main>

    <script src="./maker-model-skeleton-v01.js?v=porsche-path-fix-1007" defer></script>
  </body>
</html>
