<script>
const params=new URLSearchParams(location.search);const id=Number(params.get('id')||8131629);const posts=window.BOBAE_POSTS||[];const reference={id:8131629,title:'Fc온라인은 정신을 차려라',user:'인천미남한유섬',level:3,date:'09.01',view:128,likes:1,authorAvatar:'assets/chzzk-detail/default-user.png',body:['안 그래도 서러운 제 구단가치 어디까지 떨굴 생각인거죠..','현질유저 아니면 겜하지 말라는 건가요?'],comments:[{user:'구커는 진리8282',level:14,date:'09.19',like:0,avatar:'assets/chzzk-detail/comment-avatar.jpg',text:'❓️❓️ : 니만 情身 차리면 되~^^ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ'}]};const p=posts.find(x=>x.id===id)||reference;let commentsData=(p.comments&&p.comments.length?p.comments:reference.comments).slice(0,4).map(x=>({...x}));let sortMode='등록순',up=false,down=false;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cleanTitle(v){return String(v||'').replace(/^\[[^\]]+\]\s*/,'')}function listUrl(){return './naver-cafe-list.html?v=20261015chzzk'}function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(()=>toast.classList.remove('show'),1200)}
function renderPost(){document.title=cleanTitle(p.title)+' | FC온라인';postTitle.textContent=cleanTitle(p.title);authorName.textContent=p.user||reference.user;authorLevel.textContent=p.level||3;authorDate.textContent=String(p.date||reference.date).replace(/\.$/,'');authorView.textContent=Number(p.view||0).toLocaleString();authorAvatar.src=p.authorAvatar||'assets/chzzk-detail/default-user.png';authorAvatar.onerror=()=>authorAvatar.src='assets/chzzk-detail/default-user.png';score.textContent=Number(p.likes||0);const lines=(p.body&&p.body.length?p.body:reference.body).slice(0,3);postBody.innerHTML=lines.map(x=>'<p>'+esc(x)+'</p>').join('')}
function ordered(){const copy=commentsData.map((x,i)=>({...x,index:i}));if(sortMode==='인기순')return copy.sort((a,b)=>(b.like||0)-(a.like||0));if(sortMode==='최신순')return copy.reverse();return copy}
function renderComments(){commentCount.textContent='댓글 '+commentsData.length;actionCommentCount.textContent=commentsData.length;commentList.innerHTML=ordered().map((c,i)=>'<li class="commentItem"><img class="commentAvatar" src="'+esc(c.avatar||'assets/chzzk-detail/comment-avatar.jpg')+'" alt=""><div class="commentAuthor"><span>'+esc(c.user||'보배드림 회원')+'</span><span class="level">LV '+esc(c.level||14)+'</span></div><div class="commentBody">'+esc(c.text||'좋은 정보 감사합니다.')+'</div>'+(i===0?'<img class="commentSticker" src="assets/chzzk-detail/comment-sticker.png" alt="보라색 캐릭터 스티커">':'')+'<div class="commentFoot"><span class="commentDate">'+esc(c.date||'방금 전')+'</span><button class="commentMore" aria-label="댓글 더보기"><img src="assets/detail-parity/dots-vertical.svg" alt=""></button><button class="reply" data-user="'+esc(c.user||'회원')+'"><img src="assets/detail-parity/reddit-comment.svg" alt="">답글 쓰기</button><div class="commentVotes"><button class="commentVote" data-vote="up" aria-label="댓글 추천" aria-pressed="false"><img src="assets/detail-parity/reddit-dislike.svg" alt=""><span>'+Number(c.like||0)+'</span></button><button class="commentVote" data-vote="down" aria-label="댓글 비추" aria-pressed="false"><img src="assets/detail-parity/reddit-recommend.svg" alt=""></button></div></div></li>').join('');commentList.querySelectorAll('.reply').forEach(btn=>btn.onclick=()=>{commentInput.value='@'+btn.dataset.user+' ';syncSubmit();commentInput.focus()});commentList.querySelectorAll('.commentMore').forEach(btn=>btn.onclick=()=>show('댓글 메뉴입니다'));commentList.querySelectorAll('.commentVote').forEach(btn=>btn.onclick=()=>{const set=btn.closest('.commentVotes'),active=!btn.classList.contains('active');set.querySelectorAll('.commentVote').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});if(active){btn.classList.add('active');btn.setAttribute('aria-pressed','true')}show(active?(btn.dataset.vote==='up'?'댓글을 추천했습니다':'댓글을 비추했습니다'):'반응을 취소했습니다')})}
function relatedItem(x){return '<button class="relatedItem" data-id="'+x.id+'"><span class="relatedTitle">'+cleanTitle(esc(x.title))+'</span><span class="relatedMeta"><span>'+esc(x.user||'FC온라인 회원')+'</span><span>·</span><img src="assets/chzzk-comment.svg" alt="댓글"><span>'+Number((x.comments||[]).length||x.reply||0)+'</span></span></button>'}function renderRelated(){const list=posts.filter(x=>x.id!==p.id);boardList.innerHTML=list.slice(0,5).map(relatedItem).join('');popularList.innerHTML=list.slice(5,10).map(relatedItem).join('');document.querySelectorAll('.relatedItem').forEach(btn=>btn.onclick=()=>location.href='./chzzk-detail.html?id='+btn.dataset.id)}
function syncSubmit(){const ready=commentInput.value.trim().length>0;submitBtn.disabled=!ready;submitBtn.classList.toggle('ready',ready)}async function sharePost(){const data={title:document.title,url:location.href};if(navigator.share){try{await navigator.share(data);return}catch(error){if(error.name==='AbortError')return}}try{await navigator.clipboard.writeText(location.href);show('게시글 링크를 복사했습니다')}catch(error){show('주소창의 링크를 복사해 주세요')}}
closeBtn.onclick=loungeBtn.onclick=boardBtn.onclick=()=>location.href=listUrl();appBtn.onclick=()=>show('FC온라인 라운지 앱으로 연결됩니다');boardMore.onclick=popularMore.onclick=()=>location.href=listUrl();shareBtn.onclick=sharePost;commentJump.onclick=()=>{comments.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>commentInput.focus(),250)};refreshBtn.onclick=()=>{renderComments();show('댓글을 새로고침했습니다')};sortBtn.onclick=()=>sortMenu.classList.toggle('open');sortMenu.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{sortMode=btn.dataset.sort;sortBtn.firstChild.textContent=sortMode+' ';sortMenu.classList.remove('open');sortMenu.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn));renderComments()});gearBtn.onclick=()=>show('클린봇이 켜져 있습니다');upBtn.onclick=()=>{up=!up;if(up)down=false;upBtn.classList.toggle('active',up);downBtn.classList.remove('active');upBtn.setAttribute('aria-pressed',String(up));downBtn.setAttribute('aria-pressed','false');score.textContent=Number(p.likes||0)+(up?1:0);show(up?'추천했습니다':'추천을 취소했습니다')};downBtn.onclick=()=>{down=!down;if(down)up=false;downBtn.classList.toggle('active',down);upBtn.classList.remove('active');downBtn.setAttribute('aria-pressed',String(down));upBtn.setAttribute('aria-pressed','false');score.textContent=Number(p.likes||0)-(down?1:0);show(down?'비추했습니다':'비추를 취소했습니다')};commentInput.oninput=syncSubmit;commentForm.onsubmit=e=>{e.preventDefault();const value=commentInput.value.trim();if(!value)return;commentsData.unshift({user:'보배드림 회원',level:1,date:'방금 전',text:value,like:0,avatar:'assets/chzzk-detail/default-user.png'});commentInput.value='';syncSubmit();renderComments();show('댓글이 등록되었습니다')};toTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.addEventListener('click',e=>{if(!e.target.closest('.sortWrap'))sortMenu.classList.remove('open')});renderPost();renderComments();renderRelated();
</script>
</body>
