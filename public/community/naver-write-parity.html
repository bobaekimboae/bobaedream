<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>보배드림 게시물 작성 테스트</title>
    <link rel="stylesheet" href="./naver-write-parity.css" />
  </head>
  <body>
    <main class="write-page" data-testid="write-page">
      <header class="write-header">
        <button class="icon-button close-button" type="button" aria-label="닫기" data-action="exit">
          <img src="assets/write-parity/close.svg" alt="" />
        </button>
        <div class="header-actions">
          <button class="header-link" type="button" data-action="drafts">임시 <span id="draftCount">0</span></button>
          <button class="header-link" type="button" data-action="save-draft">임시등록</button>
          <button class="submit-button" type="button" data-action="submit" disabled>등록</button>
        </div>
      </header>

      <button class="board-select" type="button" data-action="board" aria-expanded="false">
        <span id="selectedBoard">게시판을 선택해주세요.</span>
        <img src="assets/write-parity/chevron-down.svg" alt="" />
      </button>

      <section class="title-area">
        <label class="sr-only" for="postTitle">제목</label>
        <input id="postTitle" maxlength="80" placeholder="제목" autocomplete="off" />
      </section>

      <section class="editor-shell" aria-label="본문 편집기">
        <div class="primary-toolbar" role="toolbar" aria-label="콘텐츠 도구">
          <button class="tool-button" type="button" data-action="add-photo"><img src="assets/write-parity/photo.svg" alt="" /><span>사진</span></button>
          <button class="tool-button" type="button" data-tool="video"><img src="assets/write-parity/video.svg" alt="" /><span>동영상</span></button>
          <button class="tool-button" type="button" data-action="text-tools" aria-expanded="false"><img src="assets/write-parity/text.svg" alt="" /><span>텍스트 도구막대</span></button>
          <button class="tool-button" type="button" data-tool="sticker"><img src="assets/write-parity/sticker.svg" alt="" /><span>스티커</span></button>
          <button class="tool-button" type="button" data-tool="topic"><img src="assets/write-parity/tag.svg" alt="" /><span>글감</span></button>
          <button class="tool-button" type="button" data-action="quote"><img src="assets/write-parity/quote.svg" alt="" /><span>인용구</span></button>
          <button class="tool-button" type="button" data-action="divider"><img src="assets/write-parity/strike.svg" alt="" /><span>구분선</span></button>
          <button class="tool-button" type="button" data-tool="link"><img src="assets/write-parity/link.svg" alt="" /><span>링크</span></button>
          <button class="tool-button" type="button" data-action="add-file"><img src="assets/write-parity/table.svg" alt="" /><span>파일</span></button>
          <button class="tool-button" type="button" data-tool="place"><img src="assets/write-parity/place.svg" alt="" /><span>장소</span></button>
        </div>
        <input id="photoInput" class="sr-only" type="file" accept=".jpg,.jpeg,.gif,.png,.bmp,.heic,.heif,.webp" multiple />
        <input id="replacePhotoInput" class="sr-only" type="file" accept=".jpg,.jpeg,.gif,.png,.bmp,.heic,.heif,.webp" />
        <input id="fileInput" class="sr-only" type="file" />

        <div class="text-toolbar" data-testid="text-toolbar" hidden>
          <label class="select-label"><span class="sr-only">문단 스타일</span><select id="blockStyle"><option value="p">본문</option><option value="h2">소제목</option><option value="blockquote">인용구</option></select></label>
          <label class="select-label"><span class="sr-only">서체</span><select id="fontFamily"><option value="Arial">기본서체</option><option value="serif">명조체</option><option value="monospace">고정폭</option></select></label>
          <label class="select-label"><span class="sr-only">글자 크기</span><select id="fontSize"><option value="3">15</option><option value="2">13</option><option value="4">17</option><option value="5">20</option></select></label>
          <button class="format-button" type="button" data-command="bold" aria-label="굵게"><img src="assets/write-parity/bold.svg" alt="" /></button>
          <button class="format-button" type="button" data-command="italic" aria-label="기울이기"><img src="assets/write-parity/italic.svg" alt="" /></button>
          <button class="format-button format-underline" type="button" data-command="underline" aria-label="밑줄">U</button>
          <label class="format-button color-control" aria-label="글자색"><input id="foreColor" type="color" value="#222222" /><span class="color-dot"></span></label>
          <label class="format-button color-control" aria-label="배경색"><input id="backColor" type="color" value="#fff1f3" /><span class="color-box"></span></label>
          <button class="format-button" type="button" data-tool="link" aria-label="링크"><img src="assets/write-parity/link.svg" alt="" /></button>
          <button class="format-button" type="button" data-command="strikeThrough" aria-label="취소선"><img src="assets/write-parity/strike.svg" alt="" /></button>
        </div>

        <article id="postBody" class="editor-body" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="내용을 입력하세요."></article>
        <p id="uploadStatus" class="upload-status" role="status" aria-live="polite" hidden></p>
        <section id="attachmentList" class="attachment-list" aria-label="첨부 파일" hidden></section>
        <button class="add-body" type="button" data-action="add-body">본문 추가</button>
      </section>

      <section class="tag-area">
        <label class="sr-only" for="postTags">태그</label>
        <input id="postTags" placeholder="#태그 입력(#으로 구분, 최대10개)" autocomplete="off" />
      </section>

      <section class="public-settings" aria-labelledby="settingsTitle">
        <div class="settings-title-row">
          <h2 id="settingsTitle">게시물 허용 설정</h2>
          <button class="visibility-button" id="visibilityButton" type="button" data-tool="visibility">멤버 공개</button>
        </div>
        <label class="setting-row">
          <span><strong>게시물 검색 허용</strong><small>허용하면 서비스 검색 결과에서 이 게시물을 찾을 수 있습니다.</small></span>
          <input id="allowSearch" type="checkbox" checked /><i aria-hidden="true"></i>
        </label>
        <label class="setting-row compact"><span><strong>게시물 공유 허용</strong></span><input id="allowShare" type="checkbox" checked /><i aria-hidden="true"></i></label>
        <label class="setting-row compact"><span><strong>복사 · 저장 허용</strong></span><input id="allowCopy" type="checkbox" checked /><i aria-hidden="true"></i></label>
      </section>

      <footer class="write-footer">
        <div class="footer-actions"><button type="button" data-action="exit">취소</button><button type="button" class="footer-submit" data-action="submit" disabled>등록</button></div>
        <button class="to-top" type="button" data-action="top"><img src="assets/write-parity/to-top.svg" alt="" />맨위로</button>
      </footer>
    </main>

    <div class="overlay" id="boardOverlay" hidden>
      <section class="board-modal" role="dialog" aria-modal="true" aria-labelledby="boardTitle">
        <header><h2 id="boardTitle">게시판 선택</h2><button type="button" aria-label="닫기" data-action="close-board"><img src="assets/write-parity/close.svg" alt="" /></button></header>
        <label class="board-search"><img src="assets/write-parity/search.svg" alt="" /><input id="boardSearch" placeholder="게시판 검색" /></label>
        <ul id="boardList" class="board-list"></ul>
      </section>
    </div>

    <section class="draft-layer" id="draftLayer" aria-labelledby="draftTitle" hidden>
      <header><button type="button" aria-label="뒤로가기" data-action="close-drafts"><img src="assets/write-parity/chevron-left.svg" alt="" /></button><h2 id="draftTitle">이 카페 임시글</h2></header>
      <div class="draft-content" id="draftContent"><p>임시글이 없습니다.</p></div>
    </section>

    <div class="overlay" id="toolOverlay" hidden>
      <section class="tool-dialog" role="dialog" aria-modal="true" aria-labelledby="toolDialogTitle">
        <header><h2 id="toolDialogTitle">콘텐츠 추가</h2><button type="button" aria-label="닫기" data-action="close-tool"><img src="assets/write-parity/close.svg" alt="" /></button></header>
        <div id="toolDialogBody" class="tool-dialog-body"></div>
        <footer><button type="button" data-action="close-tool">취소</button><button class="tool-apply" id="toolApply" type="button">적용</button></footer>
      </section>
    </div>

    <div class="overlay" id="dialogOverlay" hidden>
      <section class="small-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header><h2 id="dialogTitle">안내</h2><button type="button" aria-label="닫기" data-action="close-dialog"><img src="assets/write-parity/close.svg" alt="" /></button></header>
        <p id="dialogMessage"></p>
        <button class="dialog-confirm" type="button" data-action="close-dialog">확인</button>
      </section>
    </div>

    <div class="overlay" id="photoEditorOverlay" hidden>
      <section class="photo-editor" role="dialog" aria-modal="true" aria-labelledby="photoEditorTitle">
        <header>
          <button type="button" aria-label="닫기" data-action="close-photo-editor"><img src="assets/write-parity/close.svg" alt="" /></button>
          <h2 id="photoEditorTitle">사진 편집</h2>
          <button class="photo-editor-done" type="button" data-action="apply-photo-editor">완료</button>
        </header>
        <div class="photo-editor-stage"><img id="photoEditorPreview" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZIfsAAAAASUVORK5CYII=" alt="편집 중인 사진" /></div>
        <div class="photo-editor-controls">
          <fieldset><legend>회전 · 반전</legend><div class="photo-editor-buttons"><button type="button" data-edit-command="rotate-left">↶ 왼쪽</button><button type="button" data-edit-command="rotate-right">↷ 오른쪽</button><button type="button" data-edit-command="flip">⇆ 좌우</button></div></fieldset>
          <fieldset><legend>비율</legend><div class="photo-editor-buttons"><button type="button" data-edit-ratio="auto">원본</button><button type="button" data-edit-ratio="1 / 1">1:1</button><button type="button" data-edit-ratio="4 / 3">4:3</button><button type="button" data-edit-ratio="16 / 9">16:9</button></div></fieldset>
          <fieldset><legend>필터</legend><div class="photo-editor-buttons"><button type="button" data-edit-filter="none">원본</button><button type="button" data-edit-filter="auto">자동</button><button type="button" data-edit-filter="mono">흑백</button><button type="button" data-edit-filter="warm">따뜻하게</button></div></fieldset>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="./naver-write-parity.js"></script>
  </body>
</html>
