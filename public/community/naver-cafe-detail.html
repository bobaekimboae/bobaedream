15px 0 13px;border-bottom:1px solid #f2f2f3}.comment.reply{grid-template-columns:32px minmax(0,1fr) 24px;margin-left:66px;border-bottom:0;padding-top:10px;padding-bottom:12px}.comment.reply .avatar{width:32px;height:32px}.cHead{display:flex;align-items:center;gap:5px;line-height:1.2}.cNick{font-size:14.6px;font-weight:810;letter-spacing:-.04em}.writer{height:19px;border-radius:10px;background:#d8fae9;color:#08a963;padding:0 7px;font-size:11px;font-weight:830;display:inline-flex;align-items:center}.new{width:17px;height:17px;border-radius:50%;background:#ff384b;color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:900}.cBody{font-size:16px;line-height:1.58;letter-spacing:-.045em;margin:7px 0 7px;word-break:keep-all}.mention{color:var(--blue);font-weight:780}.cMeta{color:#96989d;font-size:13.4px;display:flex;gap:16px}.cLike{color:#b6b8bd;font-size:25px;line-height:1;padding-top:3px}.inputBox{margin:18px 17px 25px;height:50px;border-radius:25px;background:#f5f6f8;color:#a4a6ab;display:flex;align-items:center;padding:0 16px;gap:11px;font-size:15.2px;font-weight:620}.inputAvatar{width:30px;height:30px;border-radius:50%;background:#e3e5e8}.morePosts{border-top:9px solid #f4f5f7;padding:25px 17px 12px}.sectionTitle{font-size:19.5px;font-weight:850;letter-spacing:-.05em;margin:0 0 18px}.miniPost{padding:17px 0;border-bottom:1px solid #f1f1f2;text-align:left;width:100%}.miniTitle{font-size:16.8px;line-height:1.36;letter-spacing:-.045em}.miniMeta{margin-top:6px;color:#96989d;font-size:13.3px}.popularGrid{border-top:9px solid #f4f5f7;padding:25px 17px 16px}.sectionTitle .green{color:#00a862}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px}.cardImg{width:100%;aspect-ratio:1.04;border-radius:11px;object-fit:cover;background:#eee}.cardTitle{font-size:15.6px;line-height:1.35;font-weight:710;letter-spacing:-.045em;margin-top:9px}.cardAuthor{margin-top:6px;display:flex;align-items:center;gap:5px;color:#80838a;font-size:13px}.tinyAvatar{width:22px;height:22px;border-radius:50%;object-fit:cover}.bottomBar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:393px;height:59px;background:#fff;border-top:1px solid #e4e5e8;display:flex;align-items:center;padding:0 16px;gap:18px;z-index:30}.listBtn{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:670;white-space:nowrap}.bottomBar .spacer{flex:1}.bottomIcon{font-size:25px;color:#2c3137;position:relative;display:flex;align-items:center;gap:4px;min-width:25px;justify-content:center}.bottomIcon small{font-size:14px;color:#222;font-weight:600}.badgeN{position:absolute;right:-7px;top:-5px;width:16px;height:16px;border-radius:50%;background:#f93648;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%) translateY(8px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;transition:.15s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:370px){.page{max-width:360px}.appTitle{font-size:18px}.postTitle{font-size:23px}.content p,.priceList{font-size:17.3px}.comment.reply{margin-left:52px}.bottomBar{max-width:360px;gap:14px}.adImg{width:102px}}

<body>
<main class="page">
<header class="appbar"><button class="back" onclick="location.href='./naver-cafe-list.html?v=20260820e'" aria-label="뒤로"></button><div class="appTitle">보배드림 자동차토론</div><button class="kebab" aria-label="더보기">⋮</button></header>
<section class="postHead">
  <div class="boardLink">☰ 자유게시판 ☰ ›</div>
  <h1 id="postTitle" class="postTitle"></h1>
  <div class="authorRow"><img id="authorAvatar" class="avatar" alt="작성자"><div class="authorMeta"><div id="authorNick" class="nick"></div><div id="authorSub" class="sub"></div></div><button class="subscribe">＋ 구독</button></div>
</section>
<section class="ad"><img class="adImg" src="https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=220&q=70" alt="광고"><div class="adCopy"><b>법률 상담이 필요할 땐?</b><span>자동차 분쟁·정비 피해 상담</span></div><span class="adMark">AD</span></section>
<article id="content" class="content"></article>
<div class="postAction"><button id="likeBtn"><span class="heart">♡</span><span id="likeText">좋아요</span></button><span class="barLine"></span><button onclick="show('더보기')">⋯</button></div>
<section class="commentsTop"><div id="commentTitle" class="commentTitle"></div><div class="noticeBubble">댓글 알림 설정</div></section>
<div class="botIcons">🤖 🔕</div>
<section class="commentList" id="comments"></section>
<div class="inputBox"><span class="inputAvatar"></span><span>댓글을 남겨보세요</span></div>
<section class="morePosts"><h2 class="sectionTitle">전체글 ›</h2><div id="miniPosts"></div></section>
<section class="popularGrid"><h2 class="sectionTitle">이 카페 <span class="green">인기글</span> ›</h2><div id="popular" class="grid"></div></section>
</main>
<nav class="bottomBar"><button class="listBtn" onclick="location.href='./naver-cafe-list.html?v=20260820e'">☰ <span>목록으로</span></button><span class="spacer"></span><button class="bottomIcon" onclick="toggleLike()">♡<small id="bottomLikes"></small></button><button class="bottomIcon">⋯</button><button class="bottomIcon" onclick="document.querySelector('.commentsTop').scrollIntoView({behavior:'smooth'})">💬<span class="badgeN">N</span><small id="bottomReplies"></small></button><button class="bottomIcon" onclick="show('공유')">↗</button></nav>
<div id="toast" class="toast"></div>
<script src="./scenario-data.js?v=20260820e"></script>
<script src="./rank-icons-mixed.js?v=20260820c"></script>
<script src="./scenario-avatar-fix.js?v=20260820b"></script>
<script>
const params=new URLSearchParams(location.search);const id=Number(params.get('id')||1);const posts=window.BOBAE_POSTS;const p=posts.find(x=>x.id===id)||posts[0];let liked=false;
function rankImg(post){return window.BOBAE_RANKS&&window.BOBAE_RANKS[post.rank]?`<img class="rankIcon" src="${window.BOBAE_RANKS[post.rank]}" alt="계급">`:''}
function render(){document.title=p.title;postTitle.textContent=p.title;authorAvatar.src=p.authorAvatar;authorNick.innerHTML=`${p.user} ${rankImg(p)} <span class="chat">●채팅</span>`;authorSub.textContent=`${p.date} ${p.time}  조회 ${p.view}`;content.innerHTML=p.body.map(x=>`<p>${x}</p>`).join('')+(p.thumbnail?`<img class="mainPhoto" src="${p.thumbnail.replace('w=220','w=760')}" alt="${p.title} 사진">`:``)+`<div class="priceList">예상 비용 ${Number(30000+p.id*7000).toLocaleString()}원<br>작업 시간 ${p.id%4+1}시간<br>체감 만족도 ${p.id%5+5}/10</div><p>댓글에서는 비용, 정비소 접근성, 중고가 영향, 장착 후 유지관리 중심으로 의견이 갈리도록 구성했습니다.</p>`;likeText.textContent=`좋아요 ${p.likes}`;bottomLikes.textContent=p.likes;bottomReplies.textContent=p.reply;commentTitle.innerHTML=`댓글 <span>${p.comments.length}</span> ›`;comments.innerHTML=p.comments.map(c=>`<article class="comment ${c.reply?'reply':''}"><img class="avatar" src="${c.avatar}" alt=""><div><div class="cHead"><span class="cNick">${c.user}</span>${rankImg(c)}${c.writer?'<span class="writer">작성자</span>':''}${c.date==='방금 전'?'<span class="new">N</span>':''}</div><div class="cBody">${c.text.replace(/@([가-힣A-Za-z0-9_]+)/g,'<span class="mention">@$1</span>')}</div><div class="cMeta"><span>${c.date}</span><button>답글쓰기</button></div></div><button class="cLike">♡</button></article>`).join('');miniPosts.innerHTML=posts.filter(x=>x.id!==p.id).slice(0,4).map(x=>`<button class="miniPost" onclick="location.href='./naver-cafe-detail.html?id=${x.id}&v=20260820e'"><div class="miniTitle">${x.title}</div><div class="miniMeta">${x.user} · ${x.date} · 댓글 ${x.reply}</div></button>`).join('');popular.innerHTML=posts.slice(6,10).map(x=>`<article onclick="location.href='./naver-cafe-detail.html?id=${x.id}&v=20260820e'"><img class="cardImg" src="${x.thumbnail||'https://images.unsplash.com/photo-1617788138017-80ad40651399?auto=format&fit=crop&w=360&q=75'}" alt=""><div class="cardTitle">${x.title}</div><div class="cardAuthor"><img class="tinyAvatar" src="${x.authorAvatar}" alt="">${x.user}</div></article>`).join('')}
function toggleLike(){liked=!liked;const n=p.likes+(liked?1:0);likeText.textContent=`좋아요 ${n}`;bottomLikes.textContent=n;show(liked?'좋아요 반영':'좋아요 취소')}
function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}
render();
</script>
</body>
</html>
