x;color:#a0a2a9;font-size:11px;line-height:16px}.viewMeta{display:inline-flex;align-items:center;gap:2px}.viewMeta img{width:12px;height:12px;opacity:.72}.postDivider{height:1px;margin-top:14px;background:#f0f0f2}.postContent{padding:21px 15px 12px}.postContent p{margin:0;font-size:16px;line-height:24px;font-weight:400;letter-spacing:-.035em;word-break:break-word;white-space:pre-line}.postContent p+p{margin-top:2px}.mainPhoto{display:block;width:100%;max-height:340px;margin:17px 0 5px;border-radius:8px;object-fit:cover}.reactions{height:55px;padding:6px 15px 8px;display:flex;align-items:center;justify-content:flex-end;gap:7px}.reaction{height:38px;min-width:57px;padding:0 10px;border-radius:19px;color:#b4b7bf;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:650}.reaction img{width:15px;height:15px;opacity:.72}.reaction.down img{transform:rotate(180deg)}.reaction.active{background:#f0efff;color:var(--purple)}.authorLatest{margin:0 15px 15px;border:1px solid #efeff1;border-radius:9px;padding:13px 12px 11px}.latestHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:14px;line-height:19px}.latestHead strong{font-weight:650}.latestHead strong span{color:var(--purple)}.moreLink{color:#a0a2a9;font-size:12px}.latestPost{width:100%;min-height:28px;display:grid;grid-template-columns:minmax(0,1fr) 20px;align-items:center;gap:8px;text-align:left;font-size:14px;line-height:20px;letter-spacing:-.03em}.latestPost span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.latestPost img{width:18px;height:18px;border-radius:5px;object-fit:cover;background:#eef0f2}.sectionGap{height:8px;background:#f4f5f7;border-top:1px solid #f1f2f4}.comments{padding:0 15px}.commentHead{height:55px;display:flex;align-items:center;justify-content:space-between}.commentCount{font-size:15px;line-height:20px;font-weight:650;letter-spacing:-.035em}.commentTools{display:flex;align-items:center;gap:12px}.refreshBtn{color:#a7aab2;font-size:12px}.sortWrap{position:relative}.sortBtn{height:34px;display:flex;align-items:center;gap:4px;color:#6f727a;font-size:14px}.sortBtn img{width:15px;height:15px;opacity:.7}.sortMenu{display:none;position:absolute;right:-2px;top:32px;z-index:18;width:80px;padding:7px 0;border-radius:7px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.13)}.sortMenu.open{display:block}.sortMenu button{display:block;width:100%;height:34px;text-align:left;padding:0 18px;font-size:14px}.sortMenu button.on{color:var(--purple);font-weight:700}.composerCollapsed{height:48px;margin-bottom:10px;padding:0 12px;border-radius:24px;background:var(--surface);display:flex;align-items:center;gap:9px;color:#979aa2;font-size:14px;text-align:left;width:100%}.composerCollapsed .avatar{width:30px;height:30px}.composer{display:none;min-height:150px;margin-bottom:10px;padding:11px 12px;border:1px solid #dddce8;border-radius:16px;background:var(--surface)}.composer.open{display:block}.composerHead{display:flex;align-items:center;gap:8px;margin-bottom:7px}.composerHead .avatar{width:30px;height:30px}.composerAuthor{font-size:13px;font-weight:650}.composer textarea{display:block;width:100%;height:58px;resize:none;border:0;outline:0;background:transparent;color:#30323a;font-size:14px;line-height:20px;padding:0}.composer textarea::placeholder{color:#9c9fa8}.composerFoot{display:flex;align-items:center;gap:11px;margin-top:7px}.composerTool{width:20px;height:20px;color:#777d90}.composerTool img{width:20px;height:20px;display:block;opacity:.86}.submitComment{margin-left:auto;min-width:46px;height:31px;border-radius:16px;background:#d5d6dc;color:#fff;font-size:13px;font-weight:700}.submitComment.ready{background:var(--purple)}.cleanBot{height:38px;margin-bottom:7px;border:1px solid rgba(0,0,0,.07);border-radius:3px;display:flex;align-items:center;padding:0 10px;color:#6d7078;font-size:12px}.cleanBot strong{color:var(--purple);font-size:13px;margin-right:2px}.cleanBot button{margin-left:auto;color:#9a9da5;font-size:12px}.commentList{margin:0;padding:0;list-style:none}.commentItem{position:relative;min-height:109px;padding:15px 0 14px 40px;border-bottom:1px solid #f1f1f3}.commentAvatar{position:absolute;left:0;top:15px;width:30px;height:30px;border-radius:50%;object-fit:cover;background:#ececf2}.commentAuthor{display:flex;align-items:center;gap:5px;min-height:18px;padding-right:28px;font-size:13px;line-height:18px;font-weight:650}.commentAuthor .level{font-size:10px}.authorBadge{height:17px;padding:0 6px;border-radius:9px;background:#efeffa;color:var(--purple);display:inline-flex;align-items:center;font-size:10px}.commentMore{position:absolute;right:0;top:15px;width:22px;height:22px;color:#b5b7bd;font-size:18px;line-height:20px}.commentBody{margin-top:5px;padding-right:12px;font-size:14px;line-height:20px;letter-spacing:-.025em;word-break:break-word}.mention{color:var(--blue);font-weight:650}.commentMeta{margin-top:6px;display:flex;align-items:center;gap:10px;color:#8f9299;font-size:11px;line-height:17px}.commentMeta button{font-weight:650}.commentVotes{position:absolute;right:0;bottom:16px;display:flex;gap:5px}.commentVotes button{height:25px;padding:0 8px;border:1px solid #ededf0;border-radius:13px;color:#a3a6ad;font-size:10px;display:flex;align-items:center;gap:3px}.commentVotes img{width:11px;height:11px;opacity:.65}.commentVotes .down img{transform:rotate(180deg)}.contentSection{padding:20px 15px 8px}.sectionTitle{margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;font-size:18px;line-height:24px;font-weight:750;letter-spacing:-.045em}.sectionTitle button{color:#777a82;font-size:12px;font-weight:450}.boardPost{width:100%;min-height:74px;border-bottom:1px solid #f0f0f2;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left}.boardPostTitle{font-size:15px;line-height:21px;font-weight:600;letter-spacing:-.035em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.boardPostMeta{margin-top:4px;color:#8e9198;font-size:11.5px;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.boardPost img{width:52px;height:52px;border-radius:7px;object-fit:cover}.footer{height:120px;background:#f4f5f7;color:#a0a3a9;display:flex;align-items:center;justify-content:center;font-size:11px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);opacity:0;background:#202124;color:#fff;border-radius:18px;padding:9px 13px;font-size:12px;font-weight:650;transition:.15s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){body{padding:0 0 40px}.page{box-shadow:0 0 0 1px rgba(0,0,0,.04)}}

<body>
<main class="page">
  <header class="topbar"><button class="closeBtn" id="backBtn" aria-label="닫기"><img src="assets/write-parity/close.svg" alt=""></button><div class="loungeTitle">보배드림</div><button class="loungeBtn" id="loungeBtn">라운지 가기</button></header>
  <article><header class="postHeader"><button class="boardBtn" id="boardBtn">자유게시판</button><h1 class="postTitle" id="postTitle"></h1><div class="authorLink"><img class="avatar" id="authorAvatar" alt="작성자"><div class="authorText"><div class="authorLine"><span id="authorNick"></span><span class="level" id="authorLevel"></span></div><div class="authorMeta"><span id="authorDate"></span><span class="viewMeta"><img src="assets/chzzk-view.svg" alt=""> <span id="authorView"></span></span></div></div></div><div class="postDivider"></div></header><section class="postContent" id="postContent"></section><div class="reactions"><button class="reaction" id="buffBtn"><img src="assets/chzzk-upvote.svg" alt=""><span>버프 <b id="buffCount"></b></span></button><button class="reaction down" id="nerfBtn"><img src="assets/chzzk-upvote.svg" alt=""><span>너프</span></button></div><section class="authorLatest"><div class="latestHead"><strong><span id="latestAuthor"></span>님의 최신 글</strong><button class="moreLink" id="authorMore">더보기</button></div><div id="latestPosts"></div></section></article>
  <div class="sectionGap"></div>
  <section class="comments"><div class="commentHead"><strong class="commentCount" id="commentCount"></strong><div class="commentTools"><button class="refreshBtn" id="refreshBtn">새로고침</button><div class="sortWrap"><button class="sortBtn" id="sortBtn"><span id="sortLabel">등록순</span><img src="assets/write-parity/chevron-down.svg" alt=""></button><div class="sortMenu" id="sortMenu"><button class="on" data-sort="등록순">등록순</button><button data-sort="인기순">인기순</button><button data-sort="최신순">최신순</button></div></div></div></div><button class="composerCollapsed" id="openComposer"><img class="avatar" id="composerAvatar" alt=""><span>댓글을 입력하세요</span></button><div class="composer" id="composer"><div class="composerHead"><img class="avatar" id="composerOpenAvatar" alt=""><span class="composerAuthor">보배드림 회원</span></div><textarea id="commentInput" placeholder="댓글을 입력하세요" maxlength="500"></textarea><div class="composerFoot"><button class="composerTool" aria-label="스티커 추가"><img src="assets/write-parity/sticker.svg" alt=""></button><button class="composerTool" aria-label="사진 추가"><img src="assets/write-parity/photo.svg" alt=""></button><button class="submitComment" id="submitComment" disabled>등록</button></div></div><div class="cleanBot"><strong>클린봇</strong>이 악성 댓글을 감지합니다.<button id="cleanBotSetting">설정</button></div><ol class="commentList" id="commentList"></ol></section>
  <div class="sectionGap"></div><section class="contentSection"><h2 class="sectionTitle">자유게시판 <button id="boardMore">더보기</button></h2><div id="boardPosts"></div></section>
  <div class="sectionGap"></div><section class="contentSection"><h2 class="sectionTitle">이 라운지 인기글 <button id="popularMore">더보기</button></h2><div id="popularPosts"></div></section>
  <footer class="footer">© BOBAEDREAM</footer>
</main>
<div class="toast" id="toast"></div>
<script src="./scenario-data.js?v=20260820e"></script><script src="./rank-icons-mixed.js?v=20260820c"></script><script src="./scenario-avatar-fix.js?v=20260820b"></script>
<script>
const params=new URLSearchParams(location.search);const id=Number(params.get('id')||1);const posts=window.BOBAE_POSTS||[];const p=posts.find(x=>x.id===id)||posts[0];let commentsData=p.comments.map(x=>({...x}));let sortMode='등록순';let buffed=false;let nerfed=false;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listUrl(){return './naver-cafe-list.html?v=20261015detail'}function detailUrl(post){return './naver-cafe-detail.html?id='+post.id+'&v=20261015detail'}function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(()=>toast.classList.remove('show'),1100)}function rankImg(item){return window.BOBAE_RANKS&&window.BOBAE_RANKS[item.rank]?'<img class="rankIcon" src="'+window.BOBAE_RANKS[item.rank]+'" alt="계급">':''}function cleanTitle(title){return String(title).replace(/^\[[^\]]+\]\s*/,'')}
function renderPost(){document.title=p.title;postTitle.textContent=cleanTitle(p.title);authorAvatar.src=p.authorAvatar;authorNick.textContent=p.user;authorLevel.textContent='LV '+(p.level||1);authorDate.textContent=(p.date||'').replace(/\.$/,'');authorView.textContent=Number(p.view||0).toLocaleString();buffCount.textContent=p.likes||'';latestAuthor.textContent=p.user;composerAvatar.src=p.authorAvatar;composerOpenAvatar.src=p.authorAvatar;postContent.innerHTML=p.body.map(line=>'<p>'+esc(line)+'</p>').join('')+(p.thumbnail?'<img class="mainPhoto" src="'+esc(p.thumbnail.replace('w=220','w=760'))+'" alt="'+esc(cleanTitle(p.title))+' 사진">':'');const latest=posts.filter(x=>x.id!==p.id&&x.category===p.category).concat(posts.filter(x=>x.id!==p.id&&x.category!==p.category)).slice(0,3);latestPosts.innerHTML=latest.map(x=>'<button class="latestPost" data-id="'+x.id+'"><span>'+esc(cleanTitle(x.title))+'</span>'+(x.thumbnail?'<img src="'+esc(x.thumbnail)+'" alt="">':'<span></span>')+'</button>').join('');latestPosts.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>location.href=detailUrl({id:el.dataset.id}))}
function orderedComments(){const copy=commentsData.map((c,index)=>({...c,index}));if(sortMode==='인기순')return copy.sort((a,b)=>(b.like||0)-(a.like||0));if(sortMode==='최신순')return copy.reverse();return copy}
function renderComments(){commentCount.textContent='댓글 '+commentsData.length;commentList.innerHTML=orderedComments().map(c=>'<li class="commentItem"><img class="commentAvatar" src="'+esc(c.avatar||p.authorAvatar)+'" alt=""><div class="commentAuthor"><span>'+esc(c.user)+'</span>'+rankImg(c)+'<span class="level">LV '+esc(c.level||1)+'</span>'+(c.writer?'<span class="authorBadge">작성자</span>':'')+'</div><button class="commentMore" aria-label="더보기">⋮</button><div class="commentBody">'+esc(c.text).replace(/@([가-힣A-Za-z0-9_]+)/g,'<span class="mention">@$1</span>')+'</div><div class="commentMeta"><span>'+esc(c.date)+'</span><button class="replyBtn" data-user="'+esc(c.user)+'">답글 쓰기</button></div><div class="commentVotes"><button><img src="assets/chzzk-upvote.svg" alt="">'+esc(c.like||'')+'</button><button class="down"><img src="assets/chzzk-upvote.svg" alt=""></button></div></li>').join('');commentList.querySelectorAll('.replyBtn').forEach(btn=>btn.onclick=()=>openEditor('@'+btn.dataset.user+' '))}
function renderRows(target,data){target.innerHTML=data.map(x=>'<button class="boardPost" data-id="'+x.id+'"><div><div class="boardPostTitle">'+esc(cleanTitle(x.title))+'</div><div class="boardPostMeta">'+esc(x.user)+' · 댓글 '+Number(x.reply||0).toLocaleString()+(x.likes?' · 버프 '+x.likes:'')+'</div></div>'+(x.thumbnail?'<img src="'+esc(x.thumbnail)+'" alt="">':'')+'</button>').join('');target.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>location.href=detailUrl({id:el.dataset.id}))}
function openEditor(seed){openComposer.hidden=true;composer.classList.add('open');commentInput.value=seed||commentInput.value;commentInput.focus();syncSubmit()}function syncSubmit(){const ready=commentInput.value.trim().length>0;submitComment.disabled=!ready;submitComment.classList.toggle('ready',ready)}function renderAll(){renderPost();renderComments();renderRows(boardPosts,posts.filter(x=>x.id!==p.id).slice(0,5));renderRows(popularPosts,posts.filter(x=>x.id!==p.id).sort((a,b)=>(b.reply+b.likes)-(a.reply+a.likes)).slice(0,5))}
backBtn.onclick=()=>location.href=listUrl();loungeBtn.onclick=()=>location.href=listUrl();boardBtn.onclick=()=>location.href=listUrl();boardMore.onclick=()=>location.href=listUrl();popularMore.onclick=()=>location.href=listUrl();authorMore.onclick=()=>show('작성자 최신 글입니다');openComposer.onclick=()=>openEditor('');commentInput.oninput=syncSubmit;submitComment.onclick=()=>{const value=commentInput.value.trim();if(!value)return;commentsData.unshift({user:'보배드림 회원',level:'1',rank:'r1',avatar:p.authorAvatar,text:value,date:'방금 전',like:0});commentInput.value='';composer.classList.remove('open');openComposer.hidden=false;syncSubmit();renderComments();show('댓글이 등록되었습니다')};sortBtn.onclick=()=>sortMenu.classList.toggle('open');sortMenu.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{sortMode=btn.dataset.sort;sortLabel.textContent=sortMode;sortMenu.classList.remove('open');sortMenu.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn));renderComments()});refreshBtn.onclick=()=>{renderComments();show('댓글을 새로고침했습니다')};cleanBotSetting.onclick=()=>show('클린봇이 켜져 있습니다');buffBtn.onclick=()=>{buffed=!buffed;if(buffed)nerfed=false;buffBtn.classList.toggle('active',buffed);nerfBtn.classList.remove('active');buffCount.textContent=(p.likes||0)+(buffed?1:0);show(buffed?'버프했습니다':'버프를 취소했습니다')};nerfBtn.onclick=()=>{nerfed=!nerfed;if(nerfed)buffed=false;nerfBtn.classList.toggle('active',nerfed);buffBtn.classList.remove('active');buffCount.textContent=p.likes||'';show(nerfed?'너프했습니다':'너프를 취소했습니다')};document.addEventListener('click',e=>{if(!e.target.closest('.sortWrap'))sortMenu.classList.remove('open')});renderAll();
</script>
