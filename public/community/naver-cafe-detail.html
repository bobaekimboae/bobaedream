<script>
const params=new URLSearchParams(location.search);const id=Number(params.get('id')||1);const posts=window.BOBAE_POSTS||[];const p=posts.find(x=>x.id===id)||posts[0];let commentsData=(p.comments||[]).slice(0,1).map(x=>({...x}));let sortMode='등록순',buffed=false,nerfed=false,bookmarked=false,locked=false;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listUrl(){return './naver-cafe-list.html?v=20261015detail2'}function show(message){toast.textContent=message;toast.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(()=>toast.classList.remove('show'),1100)}function cleanTitle(title){return String(title||'').replace(/^\[[^\]]+\]\s*/,'')}
function renderPost(){document.title=cleanTitle(p.title);postTitle.textContent=cleanTitle(p.title);authorAvatar.src=p.authorAvatar;authorNick.textContent=p.user;authorLevel.textContent=p.level||1;authorDate.textContent=String(p.date||'').replace(/\.$/,'');authorView.textContent=Number(p.view||0).toLocaleString();buffCount.textContent=p.likes||0;postContent.innerHTML=(p.body||[]).slice(0,2).map(line=>'<p>'+esc(line)+'</p>').join('')}
function orderedComments(){const copy=commentsData.map((c,index)=>({...c,index}));if(sortMode==='인기순')return copy.sort((a,b)=>(b.like||0)-(a.like||0));if(sortMode==='최신순')return copy.reverse();return copy}
function renderComments(){commentCount.textContent='댓글 '+commentsData.length;commentList.innerHTML=orderedComments().map((c,i)=>'<li class="commentItem"><img class="commentAvatar" src="'+esc(c.avatar||p.authorAvatar)+'" alt=""><div class="commentAuthor"><span>'+esc(c.user||'보배드림 회원')+'</span><span class="commentDate">'+esc(c.date||'방금 전')+'</span></div><button class="commentMore" aria-label="댓글 더보기"><img src="assets/detail-parity/dots-vertical.svg" alt=""></button><div class="commentBody">'+esc(c.text||'좋은 정보 감사합니다.').replace(/@([가-힣A-Za-z0-9_]+)/g,'<span class="mention">@$1</span>')+'</div>'+(i===0?'<img class="commentSticker" src="assets/detail-parity/purple-comment-sticker.png" alt="보라색 캐릭터 스티커">':'')+'<div class="commentFoot"><button class="replyBtn" data-user="'+esc(c.user||'회원')+'">답글쓰기</button><div class="commentVotes"><button><span>추천</span><img src="assets/chzzk-upvote.svg" alt=""></button><button class="down"><span>비추</span><img src="assets/chzzk-upvote.svg" alt=""></button></div></div></li>').join('');commentList.querySelectorAll('.replyBtn').forEach(btn=>btn.onclick=()=>{commentInput.value='@'+btn.dataset.user+' ';syncSubmit();commentInput.focus()})}
function syncSubmit(){const ready=commentInput.value.trim().length>0;submitComment.disabled=!ready;submitComment.classList.toggle('ready',ready)}
backBtn.onclick=()=>location.href=listUrl();boardBtn.onclick=()=>location.href=listUrl();bookmarkBtn.onclick=()=>{bookmarked=!bookmarked;bookmarkBtn.classList.toggle('active',bookmarked);show(bookmarked?'북마크에 저장했습니다':'북마크를 해제했습니다')};moreBtn.onclick=()=>show('게시글 메뉴입니다');refreshBtn.onclick=()=>{renderComments();show('댓글을 새로고침했습니다')};sortBtn.onclick=()=>sortMenu.classList.toggle('open');sortMenu.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{sortMode=btn.dataset.sort;sortMenu.classList.remove('open');sortMenu.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn));renderComments()});cleanBotSetting.onclick=()=>show('클린봇이 켜져 있습니다');buffBtn.onclick=()=>{buffed=!buffed;if(buffed)nerfed=false;buffBtn.classList.toggle('active',buffed);nerfBtn.classList.remove('active');buffCount.textContent=Number(p.likes||0)+(buffed?1:0);nerfCount.textContent=0;show(buffed?'추천했습니다':'추천을 취소했습니다')};nerfBtn.onclick=()=>{nerfed=!nerfed;if(nerfed)buffed=false;nerfBtn.classList.toggle('active',nerfed);buffBtn.classList.remove('active');buffCount.textContent=p.likes||0;nerfCount.textContent=nerfed?1:0;show(nerfed?'비추했습니다':'비추를 취소했습니다')};toTopBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});photoBtn.onclick=()=>show('사진을 첨부할 수 있습니다');stickerBtn.onclick=()=>show('스티커를 선택할 수 있습니다');lockBtn.onclick=()=>{locked=!locked;lockBtn.style.opacity=locked?'1':'.55';show(locked?'비밀 댓글로 설정했습니다':'일반 댓글로 설정했습니다')};commentInput.oninput=syncSubmit;composerForm.onsubmit=e=>{e.preventDefault();const value=commentInput.value.trim();if(!value)return;commentsData.unshift({user:'보배드림 회원',avatar:p.authorAvatar,text:(locked?'[비밀 댓글] ':'')+value,date:'방금 전',like:0});commentInput.value='';syncSubmit();renderComments();show('댓글이 등록되었습니다')};document.addEventListener('click',e=>{if(!e.target.closest('.sortWrap'))sortMenu.classList.remove('open')});renderPost();renderComments();
</script>
