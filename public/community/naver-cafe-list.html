  choices('보기 방식',[['compact','간결형','','text'],['list','목록형','기본','list'],['detail-list','상세 목록형','','list'],['feed-cafe','피드 네이버 카페','','feed'],['album','앨범형','','album']],mode,'data-mode',function(value){mode=value});
  toggles('리스트 표시',[['thumbnail','썸네일'],['commentBadge','댓글 배지'],['rankBadge','계급 배지'],['recommendCount','추천수'],['categoryLabel','말머리'],['tag','태그']],display,'data-display-key');
  choices('썸네일 위치',[['right','오른쪽','기본','thumbRight'],['left','왼쪽','','thumbLeft']],thumbPosition,'data-thumb-position',function(value){thumbPosition=value});
  choices('계급 배지 위치',[['before','닉네임 앞','기본','list'],['after','닉네임 뒤','','list']],rankPosition,'data-rank-position',function(value){rankPosition=value});
  var metaGroup=toggles('메타정보 아이콘',[['profileAvatar','닉네임 프사'],['timeIcon','등록시간 아이콘'],['viewIcon','조회수 아이콘'],['recommendIcon','추천수 아이콘'],['commentIcon','댓글 아이콘']],display,'data-meta-key');
  metaGroup.dataset.adminOnly='true';
  choices('제목 줄 수',[['2','두 줄','기본','list'],['1','한 줄','','text']],String(titleLines),'data-title-lines',function(value){titleLines=Number(value)});
  document.getElementById('sheetClose').onclick=closeSheet;
  document.getElementById('sheetApply').onclick=closeSheet;
  document.getElementById('sheetReset').onclick=function(){mode='list';thumbPosition='right';titleLines=2;rankPosition='before';display={thumbnail:true,commentBadge:true,recommendCount:false,categoryLabel:true,tag:false,highlight:false,rankBadge:false,profileAvatar:false,timeIcon:false,viewIcon:false,recommendIcon:false,commentIcon:false};renderList();openSheet()};
};
// The original bindings were registered before the enhanced sheet was defined.
// Rebind after the override so the public controls always open the current editor.
document.getElementById('viewBtn').onclick=openSheet;
document.getElementById('typeBtn').onclick=openTypeSheet;
openTypeSheet=function(){
  var types=[['compact','간결형','',true,true,'compact'],['default','목록형','기본',true,true,'list'],['no-badge','목록형 · 댓글 배지 없음','',true,false,'list'],['no-thumb','목록형 · 썸네일 없음','',false,true,'list']];
  var sh=document.getElementById('sheet'),ov=document.getElementById('overlay');
  sh.innerHTML='<div class="handle"></div><div class="sheetHead"><div class="sheetTitle">유형 선택</div><button class="sheetClose" id="sheetClose" aria-label="닫기">×</button></div><div class="sheetScroll"><div class="sheetLabel">게시물 유형</div><div class="sheetGroup" role="radiogroup" aria-label="게시물 유형">'+types.map(function(type){var on=mode===type[5]&&display.thumbnail===type[3]&&display.commentBadge===type[4];return '<button class="modeRow '+(on?'on':'')+'" role="radio" aria-checked="'+on+'" data-thumb="'+(type[3]?'1':'0')+'" data-badge="'+(type[4]?'1':'0')+'" data-type-mode="'+type[5]+'">'+icon(type[0]==='compact'?'text':type[3]?'list':'text')+'<span class="modeText"><b>'+type[1]+'</b>'+(type[2]?'<em class="stateChip">'+type[2]+'</em>':'')+'</span><span class="radio" aria-hidden="true"></span></button>'}).join('')+'</div></div><div class="sheetFooter"><button class="clearBtn" id="typeReset">초기화</button><button class="applyBtn" id="typeApply">적용</button></div>';
  ov.classList.add('open');sh.classList.add('open');
  document.getElementById('sheetClose').onclick=closeSheet;
  document.getElementById('typeApply').onclick=closeSheet;
  document.getElementById('typeReset').onclick=function(){mode='list';display.thumbnail=true;display.commentBadge=true;renderList();openTypeSheet()};
  [].forEach.call(sh.querySelectorAll('[data-thumb]'),function(button){button.onclick=function(){mode=button.dataset.typeMode;display.thumbnail=button.dataset.thumb==='1';display.commentBadge=button.dataset.badge==='1';renderList();openTypeSheet()}});
};
function openBoardSheet(){
  var boards=[['자유게시판','전체'],['테슬라','테슬라'],['전기차','전기차'],['정비 / DIY','정비'],['튜닝','튜닝'],['중고차','중고차'],['보험 · 사고','보험'],['블랙박스','블박']];
  var sh=document.getElementById('sheet'),ov=document.getElementById('overlay');
  var boardRows=boards.map(function(board,index){var selected=boardLabel===board[0];return '<button class="boardRow '+(selected?'selected':'')+'" data-board-label="'+board[0]+'" data-topic="'+board[1]+'">'+icon('list')+'<span>'+board[0]+'</span>'+(board[2]?'<span class="boardNewDot" aria-hidden="true"></span>':'')+'</button>'}).join('');
  sh.innerHTML='<div class="handle"></div><div class="sheetHead"><div class="sheetTitle">게시판 선택</div><button class="sheetClose" id="sheetClose" aria-label="닫기">×</button></div><div class="boardSheetScroll"><button class="boardRow '+(boardLabel==='전체 게시글'?'selected':'')+'" data-board-label="전체 게시글" data-topic="전체">'+icon('list')+'<span>전체 게시글</span><span class="boardNewDot" aria-hidden="true"></span></button><div class="boardDivider"></div><div class="boardSectionTitle">자동차토론</div>'+boardRows+'</div>';
  ov.classList.add('open');sh.classList.add('open');
  document.getElementById('sheetClose').onclick=closeSheet;
  [].forEach.call(sh.querySelectorAll('[data-board-label]'),function(button){button.onclick=function(){boardLabel=button.dataset.boardLabel;active=Math.max(0,topics.indexOf(button.dataset.topic));document.querySelector('.boardSelectName').textContent=boardLabel;renderTabs();renderList();closeSheet();toast(boardLabel+' 선택')}});
}
document.getElementById('boardSelect').onclick=openBoardSheet;
document.getElementById('viewBtn').onclick=openSheet;
document.getElementById('typeBtn').onclick=openTypeSheet;
[].forEach.call(document.querySelectorAll('[data-gnb]'),function(button){button.onclick=function(){[].forEach.call(document.querySelectorAll('[data-gnb]'),function(item){item.classList.remove('on');item.removeAttribute('aria-current')});button.classList.add('on');button.setAttribute('aria-current','page');toast(button.dataset.gnb+' 메뉴 선택')}});
})();
