name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: category_admin
          POSTGRES_USER: category_admin
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U category_admin"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate:fresh --seed --force
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: test-password
      - run: php artisan test
      - run: php artisan route:list
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests-contract/*.test.mjs
      - run: git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- . ':!tests-contract/*' && exit 1 || exit 0
