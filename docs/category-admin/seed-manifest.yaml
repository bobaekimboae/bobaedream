manifest_version: 1
scope: P1_VERTICAL_SLICE
namespaces:
  - VEHICLE_TYPE
  - ASSET_TYPE
  - OVERLAY
  - THEME_OVERLAY
  - TRANSACTION_TYPE
  - SELLER_CHANNEL
  - SERVICE_BM
primary_types:
  implemented:
    - CAR
    - BIKE
    - TRUCK_SPECIAL
    - BUS
    - CAMPING_CARAVAN
    - CONSTRUCTION
    - MATERIAL_HANDLING
    - ATTACHMENT
    - PARTS_GOODS
  registry_seeded: []
schema_types:
  seeded:
    - FILTER
    - REGISTRATION_FORM
    - LIST_META
    - DETAIL
    - OPTION
    - SELLER
    - PAID_PRODUCT
    - MAKE_MODEL
  matrix_backlog:
    - QA_CHECKLIST
    - PLATFORM_DIFF
required_schema_types:
  - FILTER
  - REGISTRATION_FORM
  - LIST_META
  - DETAIL
  - SELLER
publish_order:
  - registry_items
  - category_nodes
  - category_node_bindings
  - category_placements
  - variable_items
  - schemas
  - schema_items
  - manufacturers
  - models
  - model_trims
  - legacy_field_mappings
verification_command: npm run test:admin
catalog_fixtures:
  encar_car:
    source: data/encar-car-depth-1005/encar-car-depth.normalized.json
    tables: [manufacturers, models, model_trims]
  bike:
    source: data/bike-catalog-1005/bike-catalog.normalized.json
    tables: [bike_manufacturers, bike_model_groups, bike_models]
    note: 차량 기준표 통합 결정 전까지 별도 fixture 테이블 사용
