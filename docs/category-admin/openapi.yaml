openapi: 3.1.0
info:
  title: Bobaedream Multi Category Admin API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8788
paths:
  /api/admin/variable-matrix:
    get:
      summary: 차량유형별 가변 화면 매트릭스
      description: 필수 스키마인 필터, 등록폼, 리스트 메타, 상세, 판매자와 선택 설계축인 옵션, 유료상품, 제조사·모델, QA, 플랫폼 차이의 유형별 항목 수와 배포 상태를 운영자 화면에 제공한다.
      parameters:
        - { name: scope_key, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Vehicle or asset scope matrix }
        "403": { description: Admin read permission required }
  /api/v1/placements:
    get:
      summary: 공개 메뉴 배치 목록
      responses:
        "200": { description: Active placements }
  /api/v1/placements/{placement_key}/schemas/{schema_type}:
    get:
      summary: Published 화면 스키마 해석
      parameters:
        - { name: placement_key, in: path, required: true, schema: { type: string } }
        - { name: schema_type, in: path, required: true, schema: { type: string } }
        - { name: platform, in: query, required: true, schema: { type: string, enum: [PC_WEB, MOBILE_WEB, MOBILE_APP, ADMIN, ALL] } }
      responses:
        "200": { description: Published schema snapshot }
        "404": { description: No published schema }
  /api/admin/schemas/{id}/actions/publish:
    post:
      summary: QA 승인 스키마 배포
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Published snapshot and hash }
        "403": { description: Publisher permission required }
        "409": { description: Invalid workflow transition }
        "422": { description: Schema validation failed }
  /api/admin/schemas/{id}/actions/rollback:
    post:
      summary: 이전 Published snapshot 복구
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Activated previous snapshot }
        "409": { description: Previous snapshot missing }
  /api/internal/v1/listings/{listing_id}/classify:
    post:
      summary: 매물 다중 카테고리 판정 및 Projection 생성
      parameters:
        - { name: listing_id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: 의미 카테고리와 실제 노출 위치가 분리된 classification projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResult"
  /api/internal/v1/listings/{listing_id}/projection:
    get:
      summary: 저장된 매물 분류 Projection 조회
      parameters:
        - { name: listing_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stored classification projection
        "404": { description: Projection missing }
components:
  schemas:
    ClassificationResult:
      type: object
      required: [dry_run, projection]
      properties:
        dry_run: { type: boolean }
        projection:
          type: object
          required: [listing_id, listing_domain, category_node_keys, placement_keys, overlay_keys, resolution_version]
          properties:
            listing_id: { type: string }
            listing_domain: { type: string, enum: [VEHICLE_LISTING, PARTS_LISTING] }
            vehicle_type_key: { type: [string, "null"] }
            asset_type_key: { type: [string, "null"] }
            category_node_keys:
              type: array
              description: 매물의 의미 분류 키. 메뉴 alias 키를 포함하지 않는다.
              items: { type: string }
            placement_keys:
              type: array
              description: PC·모바일·전문관 등 실제 노출 위치 키.
              items: { type: string }
            overlay_keys:
              type: array
              items: { type: string }
            attributes: { type: object, additionalProperties: true }
            resolution_version: { type: string }
