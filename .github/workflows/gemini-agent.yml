name: Gemini agent requests

on:
  push:
    branches: [automation/gemini-agent]
    paths: [automation/gemini-agent/request.json]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: automation/gemini-agent
      - name: Call Gemini once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 automation/gemini-agent/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gemini-result
          path: gemini-result.json
          if-no-files-found: error
          retention-days: 3
