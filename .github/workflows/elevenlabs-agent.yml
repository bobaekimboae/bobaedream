name: ElevenLabs agent narration

on:
  push:
    branches: [automation/gemini-agent]
    paths: [automation/elevenlabs-agent/request.json]

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: automation/elevenlabs-agent
      - name: Generate Korean audio once
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 automation/elevenlabs-agent/synthesize.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: elevenlabs-narration
          path: narration.wav
          if-no-files-found: error
          retention-days: 3
