name: AS24 shorts edit analysis (Gemini)

# 오토스카우트24 쇼츠(네덜란드·벨기에 각 100편)를 Gemini로 해부한다. 이 브랜치에 push하면 돈다.
# 결과는 as24-analysis-results 브랜치의 reports/as24-analysis/ 에 쌓인다(main 배포와 무관).
# 이미 끝난 영상은 건너뛰므로, 한도·시간 때문에 멈추면 다시 실행(workflow_dispatch)하면 이어서 한다.
on:
  push:
    branches: [codex/as24-analysis]
    paths:
      - scripts/shortform/as24/**
      - .github/workflows/as24-analysis.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: as24-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load earlier results (resume)
        run: |
          mkdir -p out
          if git fetch -q origin +refs/heads/as24-analysis-results:refs/remotes/origin/as24-analysis-results; then
            git archive origin/as24-analysis-results reports/as24-analysis | tar -x -C /tmp || true
            cp /tmp/reports/as24-analysis/*.json out/ 2>/dev/null || true
          fi
          ls out | wc -l
      - name: Analyze shorts with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AS24_FPS: "1"
          AS24_RPM: "12"
          AS24_WORKERS: "6"
          AS24_MODELS: "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-2.5-flash,gemini-3.1-pro-preview,gemini-omni-1.2-flash,gemini-omni-1.1-flash,gemini-flash-latest,gemini-pro-latest,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview,gemini-2.5-flash-lite,gemini-flash-lite-latest"
          AS24_BUDGET_MIN: "320"
          AS24_CHECKPOINT_CMD: scripts/shortform/as24/push_results.sh
        run: |
          git config --global user.name "bobaedream-analysis-bot"
          git config --global user.email "actions@users.noreply.github.com"
          python -u scripts/shortform/as24/analyze_gemini.py scripts/shortform/as24/targets.txt out
      - name: Push results to results branch
        if: always()
        run: scripts/shortform/as24/push_results.sh
