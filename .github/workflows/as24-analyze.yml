name: as24 shorts analyze (Gemini)

# 오토스카우트24 쇼츠를 제미나이 유료 API로 분석한다.
# 키는 저장소 Secrets 의 GEMINI_API_KEY 로만 받는다(코드·로그에 남기지 않음).
# analysis/as24 브랜치에 목록(scripts/shortform/as24-jobs/*.txt)을 올리면 돈다.
on:
  push:
    branches: [analysis/as24, analysis/as24-de, analysis/refs, analysis/kr-dealers]
    paths: ["scripts/shortform/as24-jobs/**"]
  workflow_dispatch:
    inputs:
      model:
        description: 제미나이 모델
        default: gemini-3.8-flash
      limit:
        description: 목록 파일당 최대 편수
        default: "300"

permissions:
  contents: write

concurrency:
  group: as24-analyze-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: list channel shorts
        run: |
          # *.channels 한 줄 = "국가 @핸들 최대편수" → 같은 이름 .txt 로 쇼츠 ID 목록을 만든다
          pip install -q yt-dlp
          mkdir -p reports/shortform
          for f in scripts/shortform/as24-jobs/*.channels; do
            [ -e "$f" ] || continue
            out="${f%.channels}.txt"; [ -s "$out" ] && continue
            : > "$out.tmp"
            while read -r c h n; do
              [ -z "$c" ] && continue; case "$c" in \#*) continue;; esac
              got=$(yt-dlp --flat-playlist --print id --playlist-end "${n:-100}" "https://www.youtube.com/$h/shorts" 2>>reports/shortform/as24-list-errors.log || true)
              echo "$c $h $(echo "$got" | grep -c .)" >> reports/shortform/as24-lists.log
              echo "$got" | grep . | sed "s/^/$c /" >> "$out.tmp" || true
            done < "$f"
            awk '!s[$2]++' "$out.tmp" > "$out"; rm -f "$out.tmp"
          done
          cat reports/shortform/as24-lists.log || true
      - name: analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
          LIMIT: ${{ inputs.limit || '300' }}
        run: |
          for f in scripts/shortform/as24-jobs/*.txt; do
            name=$(basename "$f" .txt)
            python3 scripts/shortform/as24_analyze.py "$f" "reports/shortform/as24-$name" "$MODEL" "$LIMIT"
          done
      - name: save results
        if: always()
        run: |
          git config user.name "as24-analyze"
          git config user.email "actions@users.noreply.github.com"
          git add reports/shortform scripts/shortform/as24-jobs || true
          git diff --cached --quiet || git commit -m "as24 분석 결과 저장 (${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: as24-analysis
          path: reports/shortform
