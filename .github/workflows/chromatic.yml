name: Chromatic UI Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run storybook:build
      - name: Publish Storybook to Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN secret is not set; skipping Chromatic publish."
            exit 0
          fi
          npx chromatic --storybook-build-dir dist/client/storybook --exit-zero-on-changes
