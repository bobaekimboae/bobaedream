name: Sync overseas automotive news

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: foreign-news-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect permitted feeds
        run: npm run news:collect
        env:
          FOREIGN_NEWS_MAX_ARTICLES: "500"
          FOREIGN_NEWS_COLLECT_CONCURRENCY: "6"
          NEWS_TRANSLATE_ENDPOINT: ${{ secrets.NEWS_TRANSLATE_ENDPOINT }}
          NEWS_TRANSLATE_TOKEN: ${{ secrets.NEWS_TRANSLATE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATE_MODEL: "gpt-5-mini"
          OPENAI_TRANSLATE_MAX_ARTICLES: "100"
          OPENAI_TRANSLATE_BATCH_SIZE: "10"
          IFRAMELY_API_KEY: ${{ secrets.IFRAMELY_API_KEY }}
          IFRAMELY_MAX_URLS: "50"
          IFRAMELY_CONCURRENCY: "3"
          IFRAMELY_CACHE_TTL_HOURS: "24"
          # 구글 시트 「해외뉴스_번역」(Apps Script 구글 번역) 탭에서 한국어 제목·요약을 읽는다
          FOREIGN_NEWS_TRANSLATION_SHEET_ID: "1hShhSU2q9CWDK3RSugXpJA6UruWGdBOGKn91MpScaTQ"
          FOREIGN_NEWS_TRANSLATION_SHEET_TAB: "해외뉴스_번역"
      - name: Sync Google Sheet
        run: npm run news:sync-sheet
        env:
          FOREIGN_NEWS_SHEET_ID: ${{ secrets.FOREIGN_NEWS_SHEET_ID }}
          FOREIGN_NEWS_SHEET_TAB: "해외자동차뉴스_자동수집"
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/community/data/foreign-car-news.json public/community/data/board-foreign-car-news.js; then
            echo "No article changes"
            exit 0
          fi
          git config user.name "bobaedream-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/community/data/foreign-car-news.json public/community/data/board-foreign-car-news.js
          git commit -m "data: refresh overseas automotive news"
          # 다른 작업이 main 에 먼저 올라가 있으면 최신 main 위로 다시 얹어서 올린다(최대 5번)
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          exit 1
