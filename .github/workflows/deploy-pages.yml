name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'admin-server/**'
      - 'research/**'
      - 'tests/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify quick-filter app
        run: npm run verify:qf
      - name: Prepare Pages artifact
        run: |
          node scripts/prepare-sites-build.mjs
          node apps/variable-category-admin/scripts/sync-pages-demo.mjs
      - name: Build standalone shootkit lab
        working-directory: nuxt-shootkit-lab
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Add standalone shootkit lab to Pages artifact
        run: |
          mkdir -p dist/client/nuxt-shootkit-lab
          cp -R nuxt-shootkit-lab/.output/public/. dist/client/nuxt-shootkit-lab/
      - name: Prepare project-site paths
        run: find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec sed -i 's|/assets/|/bobaedream/assets/|g' {} +
      - name: Fix lazy-load preload paths
        # 나중에 불러오는 파일(ShootRegister 등)의 미리 불러오기 주소가 사이트 맨 위 /assets/로 잡혀 404가 나던 것(2026-10-25 최종 크로스체크)
        run: find dist/client -type f -name '*.js' -exec sed -i 's|return`/`+|return`/bobaedream/`+|g' {} +
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

