name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!admin-server/**'
      - '!research/**'
      - '!tests/**'
      - '!**/*.md'
      - 'tests/shortform-audio-qc.test.mjs'
      - 'tests/fixtures/shortform-audio/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify shortform narration channel timing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node --test tests/shortform-audio-qc.test.mjs
          node scripts/check-shortform-audio.mjs --manifest media-contracts/shortform-audio.json
      - name: Verify quick-filter app
        run: npm run verify:qf
      - name: Prepare Pages artifact
        run: |
          node scripts/prepare-sites-build.mjs
          node apps/variable-category-admin/scripts/sync-pages-demo.mjs
      - name: Build standalone shootkit lab
        working-directory: nuxt-shootkit-lab
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Add standalone shootkit lab to Pages artifact
        run: |
          mkdir -p dist/client/nuxt-shootkit-lab
          cp -R nuxt-shootkit-lab/.output/public/. dist/client/nuxt-shootkit-lab/
      - name: Build leh site
        working-directory: leh
        env:
          NUXT_APP_BASE_URL: /bobaedream/leh/
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Add leh site to Pages artifact
        run: |
          mkdir -p dist/client/leh
          cp -R leh/.output/public/. dist/client/leh/
      - name: Build Nuxt community
        working-directory: nuxt-community
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm generate
      - name: Add Nuxt community to Pages artifact
        run: |
          mkdir -p dist/client/nuxt-community
          cp -R nuxt-community/.output/public/. dist/client/nuxt-community/
      - name: Prepare project-site paths
        run: find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec sed -i 's|/assets/|/bobaedream/assets/|g' {} +
      - name: Fix lazy-load preload paths
        # 나중에 불러오는 파일(ShootRegister 등)의 미리 불러오기 주소가 사이트 맨 위 /assets/로 잡혀 404가 나던 것(2026-10-25 최종 크로스체크)
        run: find dist/client -type f -name '*.js' -exec sed -i 's|return`/`+|return`/bobaedream/`+|g' {} +
      - name: Leave out videos served from media repos
        # 2026-11-10 사이트 1.84GB → 페이지 배포 시간 초과. 영상은 bobaedream-media-1~3 저장소에서 불러오므로 배포 묶음에서 뺀다(원본은 저장소에 남음)
        run: |
          if [ -f scripts/media-split/moved.txt ]; then
            while IFS= read -r f; do [ -n "$f" ] && rm -f "dist/client/$f"; done < scripts/media-split/moved.txt
          fi
          du -sh dist/client
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 2026-11-10: 사이트가 약 630MB라 Pages 파일 반영이 10분(기본)을 넘겨 두 번 취소됨 → 30분까지 기다림
          timeout: 1800000

