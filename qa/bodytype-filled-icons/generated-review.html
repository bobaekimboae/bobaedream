<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>차종 아이콘 이미지 생성 비교</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f4f5f7; color: #171717; font-family: Pretendard, Arial, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 24px; color: #666; }
    .panel { margin-bottom: 24px; padding: 24px; border: 1px solid #e2e4e8; border-radius: 16px; background: white; }
    h2 { margin: 0 0 16px; font-size: 18px; }
    .source { width: 100%; max-width: 1180px; display: block; }
    .generated { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .generated figure { margin: 0; padding: 16px; border: 1px solid #e6e6e6; border-radius: 12px; background: #fff; }
    .generated img { width: 100%; display: block; object-fit: contain; }
    figcaption { padding-top: 10px; font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Notion 차종 원본 → 필드형 이미지 생성 비교</h1>
  <p>원본 17종의 실루엣과 생성 결과의 차종 식별성을 작은 크기 기준으로 확인한다.</p>
  <section class="panel">
    <h2>Notion / AutoScout24 원본 17종</h2>
    <img class="source" src="./source-contact-sheet.png" alt="원본 차종 아이콘 17종">
  </section>
  <section class="panel">
    <h2>ImageGen 필드형 생성 결과 v1</h2>
    <div class="generated">
      <figure>
        <img src="../../public/assets/bbm/bodytypes/generated/passenger-filled-v1.png" alt="승용 차종 필드형 아이콘">
        <figcaption>승용 9종</figcaption>
      </figure>
      <figure>
        <img src="../../public/assets/bbm/bodytypes/generated/commercial-filled-v1.png" alt="상용 및 기타 차종 필드형 아이콘">
        <figcaption>상용·기타 8종</figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
