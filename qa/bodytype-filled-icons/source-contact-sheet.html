<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoScout24 body type source icons</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px; background: #fff; color: #171717; font-family: Arial, sans-serif; }
    h1 { margin: 0 0 28px; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
    .item { display: flex; min-height: 150px; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 1px solid #ddd; border-radius: 16px; }
    img { width: 112px; height: 72px; object-fit: contain; }
    span { font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>AutoScout24 원본 차종 아이콘</h1>
  <div class="grid">
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/small-car.svg"><span>소형차</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/sedan.svg"><span>세단</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/coupe.svg"><span>쿠페</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/cabrio.svg"><span>카브리오</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/wagon.svg"><span>왜건</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/suv.svg"><span>SUV</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/minivan.svg"><span>미니밴</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/van.svg"><span>밴</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/pickup.svg"><span>픽업</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/caravan.svg"><span>캠핑카</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/truck.svg"><span>트럭</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/tractor.svg"><span>트랙터</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/trailer.svg"><span>트레일러</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/semi-trailer.svg"><span>세미트레일러</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/construction.svg"><span>건설기계</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/multiple.svg"><span>여러 차종</span></div>
    <div class="item"><img src="../../public/assets/bbm/bodytypes/autoscout-original/other.svg"><span>기타</span></div>
  </div>
</body>
</html>
