<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>트럭 유형 이미지 검수</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#f4f5f7;color:#222;font-family:Pretendard,"Noto Sans KR",sans-serif}
  main{max-width:960px;margin:0 auto;padding:24px} h1{margin:0 0 8px;font-size:22px} p{margin:0 0 20px;color:#666;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{display:grid;grid-template-rows:104px auto;place-items:center;padding:10px 8px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
  img{display:block;width:100%;height:104px;object-fit:contain;object-position:center bottom}.label{margin-top:8px;font-size:13px;font-weight:600;text-align:center}
  .mobile{margin-top:24px;display:flex;gap:8px;overflow:hidden;padding:12px 16px;background:#fff}.slot{width:76px;height:102px;flex:0 0 76px;display:flex;flex-direction:column;align-items:center}.slot img{width:60px;height:40px;margin-top:6px}.slot span{display:-webkit-box;width:68px;margin-top:14px;overflow:hidden;color:#595959;font-size:14px;font-weight:600;line-height:21px;text-align:center;word-break:keep-all;-webkit-box-orient:vertical;-webkit-line-clamp:2}
  @media(max-width:700px){main{padding:16px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 16px}h1,p{padding:0 16px}}
</style>
<main>
  <h1>트럭 유형 이미지 · AutoScout × 초톳 슬롯</h1><p>좌향 정측면 · 흰 캡 · 중립 장비부 · 투명 배경 · 13% 접지 그림자</p>
  <section class="grid" id="grid"></section><section class="mobile" id="mobile"></section>
</main>
<script>
const root='../../public/assets/truck/types/autoscout-v01/';
const items=[['cargo.png','카고(화물)트럭'],['wingbody.png','윙바디·탑차'],['reefer.png','냉장·냉동차'],['dump.png','덤프·믹서'],['crane.png','크레인·고소작업차'],['tanker.png','탱크로리'],['waste.png','환경·폐기물차'],['transport.png','견인·운송차'],['tractor.png','트랙터 헤드'],['trailer.png','트레일러'],['special.png','특수차'],['bus.png','버스'],['motorhome.png','캠핑카·카라반'],['other.png','기타 화물차']];
grid.innerHTML=items.map(([f,l])=>`<article class="card"><img src="${root+f}" alt=""><b class="label">${l}</b></article>`).join('');
mobile.innerHTML=items.map(([f,l])=>`<article class="slot"><img src="${root+f}" alt=""><span>${l}</span></article>`).join('');
</script>
</html>
