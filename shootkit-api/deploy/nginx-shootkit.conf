# 보배드림 촬영 키트 시험 서버(121.78.125.73) nginx 설정. deploy/server-setup.sh 가 /etc/nginx/sites-available/shootkit 로 복사한다.
# 주소: https://121-78-125-73.sslip.io (IP를 도메인처럼 쓰는 sslip.io + Let's Encrypt, certbot 이 아래에 ssl 줄을 더한다)
server {
    listen 80;
    server_name 121-78-125-73.sslip.io 121.78.125.73;

    root /var/www/bobaedream/shootkit-api/public;
    index index.php;

    # 영상 300MB + 여유
    client_max_body_size 320m;
    client_body_timeout 300s;

    # 올린 사진·영상(public/storage → storage/app/public 심볼릭 링크)
    location /storage/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
